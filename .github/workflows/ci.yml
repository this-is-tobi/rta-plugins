# The gates `make ci` runs, on the machines a laptop is not.
#
# lint-commits, scan-secrets and the changed-paths classifier come from the
# shared workflow catalogue. The plugin gates stay local: one job walking the
# modules in scope beats a catalogue call per module, each paying a runner, a
# checkout and a cache restore.
name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    branches:
    - "**"

# A superseded run is not worth finishing: a follow-up push to the same
# branch cancels the run for the commit it replaced.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# Every job below narrows this further; nothing here writes.
permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint commits
    if: ${{ github.event_name == 'pull_request' }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-commits.yml@v0
    permissions:
      contents: read
      pull-requests: read

  # A pull request that only touches prose has nothing for the build gates to
  # check. Everything unmatched counts as code, so an unanticipated path fails
  # toward running the suite rather than skipping it. index/*.yaml counts as
  # code on purpose: a manifest is a claim every install verifies against.
  #
  # .release-please-manifest.json does not. It is release-please's record of
  # the last version of each plugin, and no module builds from it; a release
  # pull request changes it beside the changelogs and nothing else, and
  # release-please pushes that pull request again after every merge to main.
  # Counted as code, each push checked all twelve modules on two operating
  # systems over a tree main had already passed.
  #
  # Prose is named file by file rather than as *.md, because two kinds of
  # Markdown here are read by a gate. A plugin's README.md is its declaration
  # rendered, and docs-drift fails when the committed page disagrees with the
  # binary, so it is that module's code: counted as prose, a hand edit to
  # one merged with docs-drift never run. The root README.md states each
  # plugin's capability count and docs-check holds it to the source, so it
  # is prose to every module, and read by the guards, which every pull
  # request runs.
  #
  # Code under plugins/<name>/ touches that module; code anywhere else — the
  # Makefile, .rta-version, .golangci.yml, index/, .github/ — is shared, and
  # checks every module. The shell doing this lives in the catalogue, beside
  # tests that feed it file names built to break it, and needs no filter
  # action and no checkout.
  changes:
    name: Detect changed paths
    uses: this-is-tobi/github-workflows/.github/workflows/classify-changes.yml@v0
    permissions:
      pull-requests: read
    with:
      PROSE_PATTERNS: >-
        ["README.md", "AGENTS.md", "CLAUDE.md", "SECURITY.md", "plugins/*/CHANGELOG.md",
        "LICENSE", "NOTICE", ".release-please-manifest.json"]
      MODULE_ROOT: plugins/

  # Which modules the gates below check: the ones a pull request's code
  # touched, or every one when it touched something they share. A name the
  # tree does not hold as a module — a plugin the pull request deletes, a
  # directory under plugins/ that is not one — checks every module too,
  # rather than handing make a name it cannot build.
  #
  # The classifier's names come from paths whoever opened the pull request
  # chose, so no gate takes them from it. This job answers with names
  # `make list` read off the tree, every one past name-check's
  # lowercase-letters-digits-and-dashes rule, joined by spaces. Code touches
  # a module or a shared file, so the list is never empty when this runs;
  # the gates below still skip on an empty one rather than hand make a
  # PLUGINS it refuses.
  scope:
    name: Choose the modules to check
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.scope.outputs.plugins }}
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Choose the modules
      id: scope
      env:
        MODULES: ${{ needs.changes.outputs.modules }}
        SHARED: ${{ needs.changes.outputs.shared }}
      run: |-
        all=$(make list)
        plugins=$(jq -rn --argjson touched "$MODULES" --arg shared "$SHARED" --arg all "$all" '
          ($all | split("\n") | map(select(. != ""))) as $all
          | if $shared == "true" or ($touched - $all) != [] then $all else $touched end
          | join(" ")')
        echo "in scope: ${plugins:-no module}"
        echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  # Both operating systems: a plugin is a binary and the sandbox that confines
  # it differs per OS. -k is fail-fast:false by other means — every module is
  # attempted and every failure named, not just the first.
  #
  # The guards read the whole tree whatever is in scope. They take seconds,
  # and what docs-check compares spans modules: the root README's counts
  # against every plugin's source. Building, vetting, testing, linting and
  # docs-drift — the minutes — take the modules in scope, through the PLUGINS
  # the Makefile narrows every per-module target by. A module nothing touched
  # is the one main already passed; nothing it builds from moved.
  check:
    name: Check the modules in scope
    needs: scope
    if: ${{ needs.scope.outputs.plugins != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # No root module. Every plugin declares the same toolchain, and pg
        # is the first one anybody bumps.
        go-version-file: plugins/pg/go.mod
        cache: true
        cache-dependency-path: plugins/*/go.sum

    # Exact, not floating, for the reason cd.yml pins the manifest generator:
    # the rta that renders a README decides what the README says. The pin is
    # .rta-version, which bump-rta moves with the modules.
    - name: Install rta
      run: go install "github.com/this-is-tobi/rta/cmd/rta@$(cat .rta-version)"

    - name: Guards over every module, then build, vet, test and format-check the modules in scope
      env:
        SCOPE: ${{ needs.scope.outputs.plugins }}
      run: |-
        make fmt-check name-check replace-check docs-check
        make -k check PLUGINS="$SCOPE" && make docs-drift PLUGINS="$SCOPE"

    # Once, not per operating system: the linters read source, and no plugin
    # module has a platform-specific file for a second pass to reach. It rides
    # this job rather than its own for the reason at the top of this file — a
    # separate job pays a runner, a checkout and a cache restore to run one
    # command against the tree already sitting here.
    - name: Lint the modules in scope
      if: ${{ matrix.os == 'ubuntu-latest' }}
      env:
        SCOPE: ${{ needs.scope.outputs.plugins }}
      run: make lint PLUGINS="$SCOPE"

  # The guards, for every pull request `check` skips.
  #
  # fmt-check, name-check, replace-check and docs-check read the tree rather
  # than build it, and `check` runs them before anything else. A pull request
  # changing only prose skipped them with it, and prose is not always beyond
  # them: name-check reads every entry under plugins/, so a pull request
  # adding nothing there but a CHANGELOG.md, which is prose, merged an entry
  # name-check refuses, and the next code change went red on a directory it
  # never touched. The root README, which docs-check holds to every plugin's
  # source, needed a group of its own to reach them, and every other file a
  # guard comes to read would have needed one too.
  #
  # So they run here whenever `check` does not: once, on one runner, with
  # nothing to build.
  guards:
    name: Check the tree
    needs: changes
    if: ${{ needs.changes.outputs.code == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # fmt-check's verdict is gofmt's, which comes with the toolchain, so the
    # modules' own Go rather than whatever the runner carries. No cache:
    # nothing here compiles.
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: plugins/pg/go.mod
        cache: false

    - name: Guards over every module
      run: make fmt-check name-check replace-check docs-check

  # Every target a release ships, compiled to /dev/null: what this checks is
  # that the build constraints resolve on every platform, not that the binary
  # runs there.
  cross:
    name: Cross-compile every target
    needs: scope
    if: ${{ needs.scope.outputs.plugins != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: plugins/pg/go.mod
        cache: true
        cache-dependency-path: plugins/*/go.sum

    - name: Cross-compile
      env:
        SCOPE: ${{ needs.scope.outputs.plugins }}
      run: make cross PLUGINS="$SCOPE"

  # These plugins are what an agent reaches a database through. A credential
  # in their own history would be the kind of thing rta exists to find in
  # yours. Unconditional: a docs pull request can leak one as easily.
  scan-secrets:
    name: Scan secrets
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number }}

  # Each plugin is its own module with its own go.sum. govulncheck fails only
  # on a vulnerability reachable from the module's own code, which is what
  # keeps this worth failing the build on. The SARIF pass is the paper trail,
  # one upload per module under its own govulncheck-<module> category — the
  # only shape the Security tab accepts since July 2025; the category rides
  # inside the file (automationDetails.id) because the upload API rejects it
  # as a parameter.
  #
  # The modules in scope, not all twelve: an untouched module's go.sum is the
  # one main already scanned, and scan.yml scans every module each week for
  # what was disclosed since.
  scan-deps:
    name: Scan the dependencies of the modules in scope
    needs: scope
    if: ${{ needs.scope.outputs.plugins != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: plugins/pg/go.mod
        cache: true
        cache-dependency-path: plugins/*/go.sum

    # Exact, not a range: this is third-party code executed in the job.
    - name: Install govulncheck
      # renovate: datasource=go depName=golang.org/x/vuln/cmd/govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

    - name: Scan the modules in scope
      id: scan
      env:
        SCOPE: ${{ needs.scope.outputs.plugins }}
      run: |-
        # Listed before the loop rather than in its header: a `for` over a
        # command that failed runs no iteration and succeeds, so a refused
        # list was a scan of nothing that passed.
        modules=$(make list PLUGINS="$SCOPE")
        mkdir -p "$RUNNER_TEMP/sarif"
        failed=""
        for m in $modules; do
          echo "==> plugins/$m"
          (cd "plugins/$m" && govulncheck ./...) || failed="$failed plugins/$m"
          (cd "plugins/$m" && govulncheck -format sarif ./...) > "$RUNNER_TEMP/sarif/$m.raw" || { rm -f "$RUNNER_TEMP/sarif/$m.raw"; continue; }
          jq --arg id "govulncheck-$m/" '.runs[].automationDetails.id = $id' \
            "$RUNNER_TEMP/sarif/$m.raw" > "$RUNNER_TEMP/sarif/$m.sarif" || rm -f "$RUNNER_TEMP/sarif/$m.sarif"
          rm -f "$RUNNER_TEMP/sarif/$m.raw"
        done
        find "$RUNNER_TEMP/sarif" -name '*.sarif' -size -2c -delete
        if ls "$RUNNER_TEMP"/sarif/*.sarif >/dev/null 2>&1; then
          echo "sarif=true" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$failed" ]; then
          echo "govulncheck failed or found a reachable vulnerability in:$failed"
          exit 1
        fi

    # always(): a finding fails the scan step, and a failing scan is exactly
    # when this upload matters most. A rejected upload warns instead of
    # failing, so the tab cannot mask the scan's own verdict.
    - name: Upload scan results to the Security tab
      if: ${{ always() && steps.scan.outputs.sarif == 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        for f in "$RUNNER_TEMP"/sarif/*.sarif; do
          m=$(basename "$f" .sarif)
          gh api "repos/${{ github.repository }}/code-scanning/sarifs" \
            -f commit_sha="${{ github.sha }}" \
            -f ref="${{ github.ref }}" \
            -f sarif="$(gzip -c "$f" | base64 -w0)" \
            >/dev/null || echo "::warning::could not upload the $m scan to the Security tab"
        done

  # One required check to protect the branch with. A skipped job is a pass;
  # anything else is not.
  all-jobs-passed:
    name: Check jobs status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    needs:
    - lint-commits
    - changes
    - scope
    - check
    - guards
    - cross
    - scan-secrets
    - scan-deps
    steps:
    # The context arrives through env rather than pasted into the script
    # between single quotes: it carries every job's outputs, and one quote in
    # any of them would end that string and run the rest as shell — in the
    # job whose answer is the check that protects the branch. A job output
    # built from what a pull request names, a directory under plugins/ above
    # all, is exactly where such a quote would come from.
    - name: Check status of all required jobs
      env:
        NEEDS_CONTEXT: ${{ toJson(needs) }}
      run: |-
        JOB_IDS=$(echo "$NEEDS_CONTEXT" | jq -r 'keys[]')
        for JOB_ID in $JOB_IDS; do
          RESULT=$(echo "$NEEDS_CONTEXT" | jq -r ".[\"$JOB_ID\"].result")
          echo "$JOB_ID job result: $RESULT"
          if [[ $RESULT != "success" && $RESULT != "skipped" ]]; then
            echo "***"
            echo "Error: The $JOB_ID job did not pass."
            exit 1
          fi
        done
        echo "All jobs passed or were skipped."
