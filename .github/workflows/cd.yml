# Three things make a plugin release, in order, and no job owns two of them.
#
# release-please computes each changed plugin's version from conventional
# commits, writes its changelog and publishes its release, which is what
# makes the tag `plugins/<name>/v<x.y.z>` exist. One matrix leg per released
# plugin then builds the six archives and attaches them to that release;
# attest-go attests each release by its tag. Last, one job reads the binaries
# just built and regenerates the index entries under index/ — a manifest is never written
# by hand — and commits them to main with this repository's own token. No
# credential from any other repository is involved anywhere, which is the
# reason the plugins live here rather than beside rta.
#
# The index commit is pushed with GITHUB_TOKEN on purpose: a push made with
# it does not trigger workflows, so the commit cannot start a second CD run.
#
# main only: no develop branch, no prerelease channel.
name: CD

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release please
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Unset, these fall through to the job's own GITHUB_TOKEN, which can open
    # the release pull request but not make CI run on it. The App is what
    # gets that pull request checked — the same one rta's CD uses.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # One leg per released plugin. `paths-released` is release-please's list of
  # package paths, `plugins/pg`; the Makefile addresses a plugin by name.
  binaries:
    name: Release archives
    needs: [release]
    if: ${{ needs.release.outputs.releases-created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release.outputs.paths-released) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ matrix.path }}/go.mod
        cache: true
        cache-dependency-path: ${{ matrix.path }}/go.sum

    - name: Build the six archives
      env:
        PLUGIN_PATH: ${{ matrix.path }}
        VERSION: ${{ fromJSON(needs.release.outputs.release-outputs)[format('{0}--version', matrix.path)] }}
      run: make release PLUGIN="$(basename "$PLUGIN_PATH")" VERSION="$VERSION"

    - name: Attach them to the release
      env:
        GH_TOKEN: ${{ github.token }}
        PLUGIN_PATH: ${{ matrix.path }}
        TAG: ${{ fromJSON(needs.release.outputs.release-outputs)[format('{0}--tag_name', matrix.path)] }}
      run: |-
        plugin=$(basename "$PLUGIN_PATH")
        gh release upload "$TAG" dist/"$plugin"/*.tar.gz dist/"$plugin"/checksums.txt --clobber

    # The index job reads these rather than downloading the release again:
    # the manifest describes the bytes this leg built, and a same-run copy is
    # the one thing that cannot have been swapped between upload and read.
    - name: Keep the archives for the index
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ strategy.job-index }}
        path: dist/
        retention-days: 1

  # Attests the exact assets the leg above published — checksums.txt names
  # every archive attached to the release — rather than a same-run copy.
  # Provenance, SBOM from the plugin's own module, and a cosign signature.
  attest:
    name: Attest
    needs: [release, binaries]
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release.outputs.paths-released) }}
    uses: this-is-tobi/github-workflows/.github/workflows/attest-go.yml@v0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      TAG: ${{ fromJSON(needs.release.outputs.release-outputs)[format('{0}--tag_name', matrix.path)] }}
      WORKING_DIRECTORY: ${{ matrix.path }}
      PROVENANCE: true
      SBOM: true
      SIGN: true

  index:
    name: Update the index
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: plugins/pg/go.mod
        cache: true
        cache-dependency-path: plugins/*/go.sum

    # Exact, not floating: the rta that generates a manifest decides what the
    # manifest says, so it is part of the supply chain.
    - name: Install rta
      # renovate: datasource=go depName=github.com/this-is-tobi/rta
      run: go install github.com/this-is-tobi/rta/cmd/rta@v0.8.0

    # Every leg uploaded its dist/<plugin>/ under its own artifact name;
    # merged back into one dist/, which is the layout index-release reads.
    - name: Fetch the archives every leg built
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Regenerate the manifests
      env:
        PATHS_RELEASED: ${{ needs.release.outputs.paths-released }}
      run: |-
        released=$(echo "$PATHS_RELEASED" | jq -r '.[]' | xargs -n1 basename | tr '\n' ' ')
        make index-release PLUGINS_RELEASED="$released"

    - name: Commit them
      env:
        PATHS_RELEASED: ${{ needs.release.outputs.paths-released }}
      run: |-
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add index/*.yaml
        if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
        released=$(echo "$PATHS_RELEASED" | jq -r '.[]' | xargs -n1 basename | paste -sd ',' - | sed 's/,/, /g')
        git commit -m "chore(index): $released"
        git push origin HEAD:main
