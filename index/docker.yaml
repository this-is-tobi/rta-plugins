# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.3.8
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.8/rta-plugin-docker_0.3.8_darwin_amd64.tar.gz
  sha256: 3d435c5d89dcb6df2d828548610fb42ae8f781afc9fabcc6a06200aefd91c63b
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.8/rta-plugin-docker_0.3.8_darwin_arm64.tar.gz
  sha256: 0d98d74649250561d232a8527712a66b602c21f76b3a43dcc25ba80b9a4104b1
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.8/rta-plugin-docker_0.3.8_linux_amd64.tar.gz
  sha256: 1f46324ae25867ab397a7bc5c4569e630db7994c231d1007c32d382f2e1ab1ee
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.8/rta-plugin-docker_0.3.8_linux_arm64.tar.gz
  sha256: 4f87feb410bfbb30dbcde246e7d3d876459f89662cca6f60df452b90d25e1d44
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: what is running, what is unhealthy, what disk is used"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.env
  summary: The environment variables one container was started with
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
