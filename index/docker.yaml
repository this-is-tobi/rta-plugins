# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.7.10
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.10/rta-plugin-docker_0.7.10_darwin_amd64.tar.gz
  sha256: 274aeb7a2d66fd5784d3e889d77c5ca39c92a6cd9f53e27fd7191c9200d36b3e
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.10/rta-plugin-docker_0.7.10_darwin_arm64.tar.gz
  sha256: 1855431a651e5f7bbd2373d3a075b31ddf8c3a3b06201c68d96d3de22f2d0bb0
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.10/rta-plugin-docker_0.7.10_linux_amd64.tar.gz
  sha256: b57dee936d3b0ac72e7839a2265cd2948e9bce3e4d5a632047a59991a60caef9
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.10/rta-plugin-docker_0.7.10_linux_arm64.tar.gz
  sha256: adaf74f0feeeba343ac100fcca453263a5afdf20f9e26672c5d2bab3597cda11
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: its verdict, what is unhealthy, where the disk went"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.env
  summary: The environment variables one container was started with
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
