# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.4.1
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.4.1/rta-plugin-docker_0.4.1_darwin_amd64.tar.gz
  sha256: cfdfd0c10402d19dab6ba4ac20a3db4b0441cb88fd7f0ace091eab11d21192c3
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.4.1/rta-plugin-docker_0.4.1_darwin_arm64.tar.gz
  sha256: 9bf12b0bab0443598fbfeac71839a1eb9a527c732208e17006927d1613ce9f3b
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.4.1/rta-plugin-docker_0.4.1_linux_amd64.tar.gz
  sha256: 9a2a2e89feecd822c2f993aa00649b124c134e8f6474025fdfc9755e7fd48171
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.4.1/rta-plugin-docker_0.4.1_linux_arm64.tar.gz
  sha256: 2ed4e4ca2f1dc4ec247a9b1dd70585972cbd396d569cf4e6ba274b59f5eff269
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: what is running, what is unhealthy, what disk is used"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.env
  summary: The environment variables one container was started with
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
