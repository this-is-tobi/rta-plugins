# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.3.4
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.4/rta-plugin-docker_0.3.4_darwin_amd64.tar.gz
  sha256: d40512d1586d0c18610a99424a70714d512718ee9bc38ededf490eae7c39d24a
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.4/rta-plugin-docker_0.3.4_darwin_arm64.tar.gz
  sha256: 9164f61480eddbc8ae5867d1b6ad1ecf6ee06af0d8bd629cb46dffbfa9d218ac
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.4/rta-plugin-docker_0.3.4_linux_amd64.tar.gz
  sha256: f59b890e689590d2001cea3d266415d2e90185fc2ad57b67f2766ceca0243863
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.3.4/rta-plugin-docker_0.3.4_linux_arm64.tar.gz
  sha256: 8cc7d084a5bd790d1d1b172f7eca05fddcf3749c2ade62b576e789f292eecde3
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: what is running, what is unhealthy, what disk is used"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.env
  summary: The environment variables one container was started with
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
