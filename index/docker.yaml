# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.5.3
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.5.3/rta-plugin-docker_0.5.3_darwin_amd64.tar.gz
  sha256: c7a0609aa220dc077e268b2ce7e9574996f6e236f8614e5f264de36b1e22f5a7
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.5.3/rta-plugin-docker_0.5.3_darwin_arm64.tar.gz
  sha256: f6e37111f6c055e33fb8936be807b26bb2d21ea494522c1d7bddff6d88f4cd99
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.5.3/rta-plugin-docker_0.5.3_linux_amd64.tar.gz
  sha256: 4dd2e4da547c9cc8ebfa0679e6c43be5d5e0e7073d813a809065c146dd6c5474
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.5.3/rta-plugin-docker_0.5.3_linux_arm64.tar.gz
  sha256: 6167dd90a7b1ad831ea40d434362fcaf5611b5604e65d36eca0b8bd564141c7d
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: its verdict, what is unhealthy, where the disk went"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.env
  summary: The environment variables one container was started with
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
