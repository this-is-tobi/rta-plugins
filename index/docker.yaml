# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.2.25
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.2.25/rta-plugin-docker_0.2.25_darwin_amd64.tar.gz
  sha256: 3e9bd928bc1c450123dd60579c03b2d5567983685dc583da85fb115639b854a4
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.2.25/rta-plugin-docker_0.2.25_darwin_arm64.tar.gz
  sha256: 40946bff2dde7554ec237a509e1f490f3d2ed41eed076a0563b71d78477ecb87
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.2.25/rta-plugin-docker_0.2.25_linux_amd64.tar.gz
  sha256: 4ea753d39f52b518cf3b53e0070967fd083fe461ecd66b0a4e653ecd6c362867
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.2.25/rta-plugin-docker_0.2.25_linux_arm64.tar.gz
  sha256: 06fb6780b139d48f62e3f4b08be0762ae36787cd5cf23ccece67bc8ec1fd1f12
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: what is running, what is unhealthy, what disk is used"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
