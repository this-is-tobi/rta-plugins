# rta-plugin-docker, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: docker
version: 0.7.4
summary: "Containers and images: what is running, what is stale, and the daily tidy-up"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/docker
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.4/rta-plugin-docker_0.7.4_darwin_amd64.tar.gz
  sha256: 263e5b138b4b8c54606f9716a6644cbf8ef923d1291d75fcb0a461838bdac952
  bin: rta-plugin-docker
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.4/rta-plugin-docker_0.7.4_darwin_arm64.tar.gz
  sha256: f77c748e3be76bb75a8ace6fd018a5325b6bc416b7f05a50427434f4f966dd94
  bin: rta-plugin-docker
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.4/rta-plugin-docker_0.7.4_linux_amd64.tar.gz
  sha256: 7791466de8331a4de060a21640537980f5966976ec2525b31b584d2366d7145f
  bin: rta-plugin-docker
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fdocker%2Fv0.7.4/rta-plugin-docker_0.7.4_linux_arm64.tar.gz
  sha256: ff449f1b5442d658a07425f65a1f5c53813233d973b45e3c9504b3b393040911
  bin: rta-plugin-docker
capabilities:
- id: docker.container.list
  summary: Containers, with state, health, ports and age
  safety: read
- id: docker.image.list
  summary: Images, with size and age
  safety: read
- id: docker.overview
  summary: "One daemon at a glance: its verdict, what is unhealthy, where the disk went"
  safety: read
- id: docker.container.inspect
  summary: Everything the daemon knows about one container
  safety: write
  grant: true
- id: docker.container.env
  summary: The environment variables one container was started with
  safety: write
  grant: true
- id: docker.container.stop
  summary: Stop a running container
  safety: write
  grant: true
- id: docker.container.restart
  summary: Restart a container
  safety: write
  grant: true
- id: docker.container.rm
  summary: Remove a container
  safety: destructive
  grant: true
