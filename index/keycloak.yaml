# rta-plugin-keycloak, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: keycloak
version: 0.11.0
summary: "Keycloak: users, clients, roles, flows, sessions, events — and a realm graded against named controls"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/keycloak
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkeycloak%2Fv0.11.0/rta-plugin-keycloak_0.11.0_darwin_amd64.tar.gz
  sha256: 7c545738822986fb6fb7ef5aafdf02681c186098f81c590199f531c68efab386
  bin: rta-plugin-keycloak
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkeycloak%2Fv0.11.0/rta-plugin-keycloak_0.11.0_darwin_arm64.tar.gz
  sha256: 017c84252a7ca543eb58e66fdbc6946c6eee1ca321049f3a467b1e23870b0f83
  bin: rta-plugin-keycloak
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkeycloak%2Fv0.11.0/rta-plugin-keycloak_0.11.0_linux_amd64.tar.gz
  sha256: 68494ba3fefa00950671a94702440e45cec1b13a37e76a140c2bb2e77a7582c1
  bin: rta-plugin-keycloak
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkeycloak%2Fv0.11.0/rta-plugin-keycloak_0.11.0_linux_arm64.tar.gz
  sha256: 40f2e1d339f41869955d9c1f63c1120c0ec38cba67eff922122bc888f9dc5650
  bin: rta-plugin-keycloak
capabilities:
- id: keycloak.overview
  summary: "One realm at a glance: its verdict, users and sessions, protections, event logging"
  safety: read
- id: keycloak.user.list
  summary: Who exists in the realm, whether each is enabled, verified and has a second factor
  safety: write
  grant: true
- id: keycloak.user.show
  summary: "One user: profile, credential types, effective roles, groups and sessions"
  safety: write
  grant: true
- id: keycloak.client.list
  summary: "Every client: public or confidential, which grants it may use, whether it enforces PKCE"
  safety: read
- id: keycloak.client.show
  summary: "One client: grants, redirect URIs, origins, scopes, the settings that matter, its service account's roles"
  safety: read
- id: keycloak.role.list
  summary: The realm's roles, or one client's, and which are composites
  safety: read
- id: keycloak.flow.list
  summary: The authentication flows, and which one each kind of login is bound to
  safety: read
- id: keycloak.flow.show
  summary: "One flow's steps as a tree: each authenticator and whether it is required, alternative, conditional or disabled"
  safety: read
- id: keycloak.session.list
  summary: "Who is signed in: sessions per client, or the sessions of one user or one client"
  safety: write
  grant: true
- id: keycloak.event.list
  summary: "Login events, newest first: logins, failures, token refreshes, who and from where"
  safety: write
  grant: true
- id: keycloak.event.admin
  summary: "Admin events, newest first: what was created, changed or deleted in the realm, by whom"
  safety: write
  grant: true
- id: keycloak.audit
  summary: "Grade the realm: second factor, brute force, passwords, clients, tokens, events, admins — each against a named control"
  safety: read
