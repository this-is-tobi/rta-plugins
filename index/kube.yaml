# rta-plugin-kube, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: kube
version: 0.2.1
summary: "Read-first Kubernetes: contexts, namespaces, pods, deployments"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/kube
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkube%2Fv0.2.1/rta-plugin-kube_0.2.1_darwin_amd64.tar.gz
  sha256: 43ad5efaee34df68a6da125925957b7cbef7e54b80827b23d4885e872cb8b11e
  bin: rta-plugin-kube
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkube%2Fv0.2.1/rta-plugin-kube_0.2.1_darwin_arm64.tar.gz
  sha256: 4450770070dce24c4513ce9154eac79e5b4971ef8efbb99e20a09bae1eec7e6f
  bin: rta-plugin-kube
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkube%2Fv0.2.1/rta-plugin-kube_0.2.1_linux_amd64.tar.gz
  sha256: 782d65c0f9615eb123c24d22e1c0c6aa942fde4ac7935787e1c3f8161eb7ef7d
  bin: rta-plugin-kube
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkube%2Fv0.2.1/rta-plugin-kube_0.2.1_linux_arm64.tar.gz
  sha256: 7a70192a583673e030b43296f211be0d2b2f9057d81ba1f26a1832993a07e8e3
  bin: rta-plugin-kube
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkube%2Fv0.2.1/rta-plugin-kube_0.2.1_windows_amd64.tar.gz
  sha256: ec0fd286eab15133537e44dce7df89dc2deaf6d83bf486e53407b485be38f093
  bin: rta-plugin-kube.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fkube%2Fv0.2.1/rta-plugin-kube_0.2.1_windows_arm64.tar.gz
  sha256: ee7b0d264a55fa6ee94a2b67dec6585aaf155c2e81261c6f951c7a18351211fd
  bin: rta-plugin-kube.exe
capabilities:
- id: kube.context.list
  summary: Every context in this machine's kubeconfig, and which one is current
  safety: read
- id: kube.context.get
  summary: "The current context in full: cluster, user and default namespace"
  safety: read
- id: kube.namespace.list
  summary: Namespaces in the cluster, with their status and age
  safety: read
- id: kube.node.list
  summary: Nodes, with readiness, cordon state and the pressures a kubelet reports
  safety: read
- id: kube.pod.list
  summary: Pods in a namespace, with readiness, restarts and age
  safety: read
- id: kube.deployment.list
  summary: Deployments in a namespace, with how many replicas are actually ready
  safety: read
- id: kube.event.list
  summary: What the cluster is complaining about, oldest-running problems still visible
  safety: read
- id: kube.quota.list
  summary: "ResourceQuota pressure per namespace: used against hard, as a percentage"
  safety: read
- id: kube.pvc.list
  summary: "PersistentVolumeClaims: capacity, requested size, storage class and phase"
  safety: read
- id: kube.cert.list
  summary: Every TLS certificate this cluster stores as a Secret, and its expiry
  safety: read
- id: kube.metrics.pod
  summary: Pod CPU/memory usage against each pod's own limit, worst pressure first
  safety: read
- id: kube.metrics.node
  summary: Node CPU/memory usage against what the node can actually allocate
  safety: read
- id: kube.metrics.pressure
  summary: "Kernel pressure stall per node: is anything waiting, and is it getting worse"
  safety: read
- id: kube.pvc.usage
  summary: How full each PersistentVolumeClaim actually is, worst first
  safety: read
- id: kube.overview
  summary: "One cluster at a glance: where you are pointed and what is not healthy"
  safety: read
- id: kube.context.set
  summary: Switch this machine's current kubeconfig context
  safety: write
  grant: true
- id: kube.serviceaccount.provision
  summary: Mint a scoped ServiceAccount, Role and token for an agent to use
  safety: write
- id: kube.serviceaccount.list
  summary: ServiceAccounts this plugin has provisioned, and whether they look expired
  safety: read
- id: kube.serviceaccount.revoke
  summary: Delete a provisioned ServiceAccount, Role and RoleBinding
  safety: destructive
  grant: true
needs:
- kubeconfig
