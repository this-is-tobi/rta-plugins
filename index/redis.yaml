# rta-plugin-redis, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: redis
version: 0.4.0
summary: "Redis: health, memory, persistence, replication, the keyspace and the slow log"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/redis
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.0/rta-plugin-redis_0.4.0_darwin_amd64.tar.gz
  sha256: 67396872082a35e68c887d6ff9e574de374fc44035f1e1cdfd24cd8e33b7983e
  bin: rta-plugin-redis
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.0/rta-plugin-redis_0.4.0_darwin_arm64.tar.gz
  sha256: 481a5798d4b1b34b8b92cbc583fe8230d435cec7634d8c629fa4357eda1a764c
  bin: rta-plugin-redis
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.0/rta-plugin-redis_0.4.0_linux_amd64.tar.gz
  sha256: 71bbf610b61507a8d8e80be1511f897707291a91b6c8b65f4a59aaa4eca061a4
  bin: rta-plugin-redis
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.0/rta-plugin-redis_0.4.0_linux_arm64.tar.gz
  sha256: 7e6be3666662473b89171d35376eb7afb4710c9b3b99c11250e720b577e6d414
  bin: rta-plugin-redis
capabilities:
- id: redis.overview
  summary: Whether this server is healthy, and what it is made of
  safety: read
- id: redis.client.list
  summary: Who is connected, from where, and what each connection is doing
  safety: read
- id: redis.cluster
  summary: "The cluster as this node sees it: state, slots, and every node's role and health"
  safety: read
- id: redis.key.list
  summary: Key names matching a pattern — never their contents
  safety: read
- id: redis.key.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: redis.key.get
  summary: What one key holds
  safety: write
  grant: true
- id: redis.config.get
  summary: What the server is configured with
  safety: write
- id: redis.slowlog
  summary: The commands that took longest, with what they were called with
  safety: write
- id: redis.memory
  summary: Where the memory goes, and what the server thinks about it
  safety: read
