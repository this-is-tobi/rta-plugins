# rta-plugin-redis, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: redis
version: 0.10.4
summary: "Redis: health, memory, persistence, replication, the keyspace and the slow log"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/redis
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.10.4/rta-plugin-redis_0.10.4_darwin_amd64.tar.gz
  sha256: 01526977f89e71a4ecf3707ec2254d208b88aac4232fa7872d3c8015aef4b523
  bin: rta-plugin-redis
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.10.4/rta-plugin-redis_0.10.4_darwin_arm64.tar.gz
  sha256: 1289695f450486d4fa32dff0cb734b5284b885a4f9c32d6c293658da5bb228b6
  bin: rta-plugin-redis
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.10.4/rta-plugin-redis_0.10.4_linux_amd64.tar.gz
  sha256: 28525fa9d14175e11c2cece58ef2dee308edbec4f015034610730312bda045c9
  bin: rta-plugin-redis
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.10.4/rta-plugin-redis_0.10.4_linux_arm64.tar.gz
  sha256: 8bc21be468caa9a763c62a23fe903f75bb1375590ca89accd6a20285988be0fd
  bin: rta-plugin-redis
capabilities:
- id: redis.overview
  summary: Whether this server is healthy, and what it is made of
  safety: read
- id: redis.client.list
  summary: Who is connected, from where, and what each connection is doing
  safety: read
- id: redis.cluster
  summary: "The cluster as this node sees it: state, slots, and every node's role and health"
  safety: read
- id: redis.key.list
  summary: Key names matching a pattern — never their contents
  safety: read
- id: redis.key.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: redis.key.get
  summary: What one key holds
  safety: write
  grant: true
- id: redis.config.get
  summary: What the server is configured with
  safety: write
- id: redis.slowlog
  summary: The commands that took longest, with what they were called with
  safety: write
- id: redis.memory
  summary: Where the memory goes, and what the server thinks about it
  safety: read
