# rta-plugin-redis, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: redis
version: 0.4.4
summary: "Redis: health, memory, persistence, replication, the keyspace and the slow log"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/redis
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.4/rta-plugin-redis_0.4.4_darwin_amd64.tar.gz
  sha256: 8709c9c991552b7070eb8f2409fcc3b0d1f0b5641c3b178940628154cb07309a
  bin: rta-plugin-redis
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.4/rta-plugin-redis_0.4.4_darwin_arm64.tar.gz
  sha256: 96a9c4debb6102b7ec8e67eca282996270a41b90043b0858b5344ec9f2d600ad
  bin: rta-plugin-redis
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.4/rta-plugin-redis_0.4.4_linux_amd64.tar.gz
  sha256: 1f7e30d2bb7644b54329a3318de1dd2efee0be7f705b9f33447643d7831e4751
  bin: rta-plugin-redis
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.4/rta-plugin-redis_0.4.4_linux_arm64.tar.gz
  sha256: 2983e739c22ba9463277868b8ca0298113e6a534672209eff2f43526974c26c7
  bin: rta-plugin-redis
capabilities:
- id: redis.overview
  summary: Whether this server is healthy, and what it is made of
  safety: read
- id: redis.client.list
  summary: Who is connected, from where, and what each connection is doing
  safety: read
- id: redis.cluster
  summary: "The cluster as this node sees it: state, slots, and every node's role and health"
  safety: read
- id: redis.key.list
  summary: Key names matching a pattern — never their contents
  safety: read
- id: redis.key.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: redis.key.get
  summary: What one key holds
  safety: write
  grant: true
- id: redis.config.get
  summary: What the server is configured with
  safety: write
- id: redis.slowlog
  summary: The commands that took longest, with what they were called with
  safety: write
- id: redis.memory
  summary: Where the memory goes, and what the server thinks about it
  safety: read
