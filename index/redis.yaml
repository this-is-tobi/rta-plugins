# rta-plugin-redis, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: redis
version: 0.7.0
summary: "Redis: health, memory, persistence, replication, the keyspace and the slow log"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/redis
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.7.0/rta-plugin-redis_0.7.0_darwin_amd64.tar.gz
  sha256: 60828de6e8733120e3ee8ca08e1395952a20fd289e8ea0a722438adac0e935ba
  bin: rta-plugin-redis
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.7.0/rta-plugin-redis_0.7.0_darwin_arm64.tar.gz
  sha256: 80551ca826d3399e2444dd00140fc05c91c2ad857f30d8929ea96ade8fec20f8
  bin: rta-plugin-redis
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.7.0/rta-plugin-redis_0.7.0_linux_amd64.tar.gz
  sha256: 81f3d5083c64cbed3a61a46309e7b1d9ca882ce41f2a2fc81cfe37d50ecea449
  bin: rta-plugin-redis
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.7.0/rta-plugin-redis_0.7.0_linux_arm64.tar.gz
  sha256: 303ecde18e6e362e0007bd8c10d166743ca60d97112a21b4cdc10fcf62d88b8e
  bin: rta-plugin-redis
capabilities:
- id: redis.overview
  summary: Whether this server is healthy, and what it is made of
  safety: read
- id: redis.client.list
  summary: Who is connected, from where, and what each connection is doing
  safety: read
- id: redis.cluster
  summary: "The cluster as this node sees it: state, slots, and every node's role and health"
  safety: read
- id: redis.key.list
  summary: Key names matching a pattern — never their contents
  safety: read
- id: redis.key.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: redis.key.get
  summary: What one key holds
  safety: write
  grant: true
- id: redis.config.get
  summary: What the server is configured with
  safety: write
- id: redis.slowlog
  summary: The commands that took longest, with what they were called with
  safety: write
- id: redis.memory
  summary: Where the memory goes, and what the server thinks about it
  safety: read
