# rta-plugin-redis, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: redis
version: 0.4.8
summary: "Redis: health, memory, persistence, replication, the keyspace and the slow log"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/redis
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.8/rta-plugin-redis_0.4.8_darwin_amd64.tar.gz
  sha256: edd04702117763f2095fc375a9bb6cefbdb7a36d75054f241f08d03619038d11
  bin: rta-plugin-redis
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.8/rta-plugin-redis_0.4.8_darwin_arm64.tar.gz
  sha256: e29e2d9dd11463be676211cd605b05da588cba09444e9755744c55cea5643813
  bin: rta-plugin-redis
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.8/rta-plugin-redis_0.4.8_linux_amd64.tar.gz
  sha256: 5f48ce120ca39fc26e7a46a53a1cfa5414aeb897a7ee44907936016f74888fd2
  bin: rta-plugin-redis
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fredis%2Fv0.4.8/rta-plugin-redis_0.4.8_linux_arm64.tar.gz
  sha256: 8bac32ca66fd7f30052a4005409dcf346ecc0a41bc136eece20940d5df72161e
  bin: rta-plugin-redis
capabilities:
- id: redis.overview
  summary: Whether this server is healthy, and what it is made of
  safety: read
- id: redis.client.list
  summary: Who is connected, from where, and what each connection is doing
  safety: read
- id: redis.cluster
  summary: "The cluster as this node sees it: state, slots, and every node's role and health"
  safety: read
- id: redis.key.list
  summary: Key names matching a pattern — never their contents
  safety: read
- id: redis.key.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: redis.key.get
  summary: What one key holds
  safety: write
  grant: true
- id: redis.config.get
  summary: What the server is configured with
  safety: write
- id: redis.slowlog
  summary: The commands that took longest, with what they were called with
  safety: write
- id: redis.memory
  summary: Where the memory goes, and what the server thinks about it
  safety: read
