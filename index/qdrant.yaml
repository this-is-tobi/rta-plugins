# rta-plugin-qdrant, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: qdrant
version: 0.9.1
summary: "Qdrant: collections, their configuration and index health"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/qdrant
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.9.1/rta-plugin-qdrant_0.9.1_darwin_amd64.tar.gz
  sha256: 8a1923b92e8bd96835efd7651c21a2feb610b6ac566b1a38bc7a3ff1b04d5d98
  bin: rta-plugin-qdrant
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.9.1/rta-plugin-qdrant_0.9.1_darwin_arm64.tar.gz
  sha256: 90bc473bdb50d08417f576de9b1dffe49e0b578df697afbb4dd48f61b41b6029
  bin: rta-plugin-qdrant
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.9.1/rta-plugin-qdrant_0.9.1_linux_amd64.tar.gz
  sha256: a232b2d09ea448210c1bba1166e86fd3ea873d82760d874d4e28c9b1c71acd57
  bin: rta-plugin-qdrant
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.9.1/rta-plugin-qdrant_0.9.1_linux_arm64.tar.gz
  sha256: 2c6ff7f851668a4e651323b74cd7e1de47ee4457dc57142d276a6322fd6d7ef8
  bin: rta-plugin-qdrant
capabilities:
- id: qdrant.overview
  summary: What this instance is and what it holds
  safety: read
- id: qdrant.collection.list
  summary: Every collection, with its size and index status
  safety: read
- id: qdrant.collection.show
  summary: How one collection is configured, and whether its index is built
  safety: read
- id: qdrant.points.count
  summary: How many points a collection holds, exactly
  safety: read
- id: qdrant.points.scroll
  summary: Read points out of a collection
  safety: write
  grant: true
- id: qdrant.dump
  summary: Back up one collection to a snapshot file, for a person at a terminal
  safety: write
- id: qdrant.restore
  summary: Restore a qdrant.dump snapshot into a collection, for a person at a terminal
  safety: destructive
