# rta-plugin-qdrant, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: qdrant
version: 0.11.2
summary: "Qdrant: collections, their configuration and index health"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/qdrant
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.2/rta-plugin-qdrant_0.11.2_darwin_amd64.tar.gz
  sha256: 142617b507444256993babb9d25ade6523d618a7e52c6f215f69e0b26519e0eb
  bin: rta-plugin-qdrant
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.2/rta-plugin-qdrant_0.11.2_darwin_arm64.tar.gz
  sha256: f3604d6482dad1173fedb4d2d63bf1f0130555ece664bebb843c05154659c025
  bin: rta-plugin-qdrant
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.2/rta-plugin-qdrant_0.11.2_linux_amd64.tar.gz
  sha256: 340a5734f7db8421f04106e4863890f034f44a29d37f54ac29da452ad57555ec
  bin: rta-plugin-qdrant
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.2/rta-plugin-qdrant_0.11.2_linux_arm64.tar.gz
  sha256: 067e9bd5184bfe02ce10fc342c3c551b849302063f49a4adeb85246e26b1c30c
  bin: rta-plugin-qdrant
capabilities:
- id: qdrant.overview
  summary: What this instance is and what it holds
  safety: read
- id: qdrant.collection.list
  summary: Every collection, with its size and index status
  safety: read
- id: qdrant.collection.show
  summary: How one collection is configured, and whether its index is built
  safety: read
- id: qdrant.points.count
  summary: How many points a collection holds, exactly
  safety: read
- id: qdrant.points.scroll
  summary: Read points out of a collection
  safety: write
  grant: true
- id: qdrant.dump
  summary: Back up one collection to a snapshot file, for a person at a terminal
  safety: write
- id: qdrant.restore
  summary: Restore a qdrant.dump snapshot into a collection, for a person at a terminal
  safety: destructive
