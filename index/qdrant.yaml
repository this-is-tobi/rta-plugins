# rta-plugin-qdrant, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: qdrant
version: 0.6.8
summary: "Qdrant: collections, their configuration and index health"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/qdrant
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.6.8/rta-plugin-qdrant_0.6.8_darwin_amd64.tar.gz
  sha256: bf2a498fca1440bcfd1658dbb50f70f43f9d9655ea21445aa484d808de2451f8
  bin: rta-plugin-qdrant
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.6.8/rta-plugin-qdrant_0.6.8_darwin_arm64.tar.gz
  sha256: 97656c975ca349284b0e023b8686e4d93c7eb5c14926dd52387a5575aabb8af6
  bin: rta-plugin-qdrant
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.6.8/rta-plugin-qdrant_0.6.8_linux_amd64.tar.gz
  sha256: f68464eaeb61a8993b145f89a294f12cc76761a92c4d14d4bc262dca7a09b20a
  bin: rta-plugin-qdrant
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.6.8/rta-plugin-qdrant_0.6.8_linux_arm64.tar.gz
  sha256: 929361cf292038ad461056222d6c0b40456db9a854bdc4d667ffd94d81e096f9
  bin: rta-plugin-qdrant
capabilities:
- id: qdrant.overview
  summary: What this instance is and what it holds
  safety: read
- id: qdrant.collection.list
  summary: Every collection, with its size and index status
  safety: read
- id: qdrant.collection.show
  summary: How one collection is configured, and whether its index is built
  safety: read
- id: qdrant.points.count
  summary: How many points a collection holds, exactly
  safety: read
- id: qdrant.points.scroll
  summary: Read points out of a collection
  safety: write
  grant: true
- id: qdrant.dump
  summary: Back up one collection to a snapshot file, for a person at a terminal
  safety: write
- id: qdrant.restore
  summary: Restore a qdrant.dump snapshot into a collection, for a person at a terminal
  safety: destructive
