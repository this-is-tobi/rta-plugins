# rta-plugin-qdrant, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: qdrant
version: 0.11.7
summary: "Qdrant: collections, their configuration and index health"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/qdrant
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.7/rta-plugin-qdrant_0.11.7_darwin_amd64.tar.gz
  sha256: 44e19a7272d1101e6d6b4edaecf290da1c9726701edfb056ba8c256ef962f082
  bin: rta-plugin-qdrant
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.7/rta-plugin-qdrant_0.11.7_darwin_arm64.tar.gz
  sha256: c534e0f1a4e6b6aa17d876dc5cedf1639cd8cbc5a8a3b368a103a84cd29ef305
  bin: rta-plugin-qdrant
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.7/rta-plugin-qdrant_0.11.7_linux_amd64.tar.gz
  sha256: e15d3b73bd2d96216f713d2e6911ce8bf1db264f33247bcd9af99e996aafbdf2
  bin: rta-plugin-qdrant
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.11.7/rta-plugin-qdrant_0.11.7_linux_arm64.tar.gz
  sha256: 41ef8c36c53d74526466a1b6091d1d510bf4f36a831d4b8f128cf235951e1278
  bin: rta-plugin-qdrant
capabilities:
- id: qdrant.overview
  summary: What this instance is and what it holds
  safety: read
- id: qdrant.collection.list
  summary: Every collection, with its size and index status
  safety: read
- id: qdrant.collection.show
  summary: How one collection is configured, and whether its index is built
  safety: read
- id: qdrant.points.count
  summary: How many points a collection holds, exactly
  safety: read
- id: qdrant.points.scroll
  summary: Read points out of a collection
  safety: write
  grant: true
- id: qdrant.dump
  summary: Back up one collection to a snapshot file, for a person at a terminal
  safety: write
- id: qdrant.restore
  summary: Restore a qdrant.dump snapshot into a collection, for a person at a terminal
  safety: destructive
