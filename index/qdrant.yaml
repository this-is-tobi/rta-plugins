# rta-plugin-qdrant, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: qdrant
version: 0.7.1
summary: "Qdrant: collections, their configuration and index health"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/qdrant
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.7.1/rta-plugin-qdrant_0.7.1_darwin_amd64.tar.gz
  sha256: eb1cd95854b86d8a97b16e92fbc48573c50c8308e22ffc74cbf1fd241aac2d03
  bin: rta-plugin-qdrant
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.7.1/rta-plugin-qdrant_0.7.1_darwin_arm64.tar.gz
  sha256: 3af07978a2126374bb66db997f9ed80dab53afe83b3d6379f7e9b164198a0674
  bin: rta-plugin-qdrant
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.7.1/rta-plugin-qdrant_0.7.1_linux_amd64.tar.gz
  sha256: fb809967d59e01690d2d70da76ca47704490a44b12dd8ea6c1037103622e524a
  bin: rta-plugin-qdrant
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fqdrant%2Fv0.7.1/rta-plugin-qdrant_0.7.1_linux_arm64.tar.gz
  sha256: ea4534d300e537bb37dc1fd9ef8c14503c2278a65f933e97bd5ebe7217b7e7bf
  bin: rta-plugin-qdrant
capabilities:
- id: qdrant.overview
  summary: What this instance is and what it holds
  safety: read
- id: qdrant.collection.list
  summary: Every collection, with its size and index status
  safety: read
- id: qdrant.collection.show
  summary: How one collection is configured, and whether its index is built
  safety: read
- id: qdrant.points.count
  summary: How many points a collection holds, exactly
  safety: read
- id: qdrant.points.scroll
  summary: Read points out of a collection
  safety: write
  grant: true
- id: qdrant.dump
  summary: Back up one collection to a snapshot file, for a person at a terminal
  safety: write
- id: qdrant.restore
  summary: Restore a qdrant.dump snapshot into a collection, for a person at a terminal
  safety: destructive
