  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.7/rta-plugin-s3_0.3.7_linux_arm64.tar.gz
  sha256: af919fc7d6be35bce1e305756c1ea4923ecddd11f7d4fbf23bf9259b78d0f1a9
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.7/rta-plugin-s3_0.3.7_windows_amd64.tar.gz
  sha256: 75e6fe5e87437483397369d436837212517a8ea970c94768fa7ed5785a35d882
