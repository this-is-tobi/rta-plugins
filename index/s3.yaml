  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.8/rta-plugin-s3_0.3.8_linux_arm64.tar.gz
  sha256: 9ab958c08057eccfefdddcb428177595f68465fc717fe656b47f0c078f690189
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.8/rta-plugin-s3_0.3.8_windows_amd64.tar.gz
  sha256: d4e18f3af369fa0e1d62f43b53fb0d4c4ff9bb0936cd44697bf9b08292a0446c
