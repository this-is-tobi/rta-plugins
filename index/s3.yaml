  sha256: 5de3d00241281faf90cc55644d2f1498b216c9509dd68232d26e2eaac2c55718
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.16/rta-plugin-s3_0.3.16_linux_amd64.tar.gz
  sha256: 84b02f0a987c2c246733ec2e3ddba407e20cd24aa3083cc89a7561f305969f17
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.16/rta-plugin-s3_0.3.16_linux_arm64.tar.gz
  sha256: 44e96298cc2585e034f7d34fa9da8055d382069ce19a68a778bbfdf676861fc4
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.16/rta-plugin-s3_0.3.16_windows_amd64.tar.gz
  sha256: 5fd28efad2fdd8d3ce9d3ded636953236bed3c58967b9a7729f107369709ba53
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.16/rta-plugin-s3_0.3.16_windows_arm64.tar.gz
