  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.4/rta-plugin-s3_0.3.4_windows_amd64.tar.gz
  sha256: 763931e5c1efeff9b3d3dcb9fa94675d263f85496dc9067756bbbf9a6efa3c22
