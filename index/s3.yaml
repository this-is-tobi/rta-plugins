# rta-plugin-s3, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: s3
version: 0.11.1
summary: "S3-compatible object storage: buckets, objects, presigned URLs and policy"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/s3
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.11.1/rta-plugin-s3_0.11.1_darwin_amd64.tar.gz
  sha256: dc774fac76aed41ced646e15faf95c3c5873e4cef7ac9ea682484c1076967a9f
  bin: rta-plugin-s3
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.11.1/rta-plugin-s3_0.11.1_darwin_arm64.tar.gz
  sha256: 72f0b3163a228d4068ffbe20fcc36286350c0840812173f7f3a0fa5b8b2c86e2
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.11.1/rta-plugin-s3_0.11.1_linux_amd64.tar.gz
  sha256: cf5662e32087bd0d57f9bbd43a9d7934063a37ecce88be7a727ed1638144a642
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.11.1/rta-plugin-s3_0.11.1_linux_arm64.tar.gz
  sha256: 3fa2d7abe13f7db63c3538ddb468f7ac5896daefb0c90f5cc9c41fd688361357
  bin: rta-plugin-s3
capabilities:
- id: s3.overview
  summary: Whether an endpoint or a bucket is healthy, at a glance
  safety: read
- id: s3.bucket.list
  summary: List every bucket the configured credentials can see
  safety: read
- id: s3.policy.get
  summary: Show a bucket's policy document
  safety: read
- id: s3.object.list
  summary: List objects in a bucket
  safety: read
- id: s3.object.tree
  summary: The shape of a bucket in one call, with objects and bytes per prefix
  safety: read
- id: s3.object.show
  summary: Show one object's metadata — size, type, etag — never its content
  safety: read
- id: s3.object.get
  summary: Download an object's content
  safety: write
  grant: true
- id: s3.object.set
  summary: Upload (or overwrite) an object
  safety: write
  grant: true
- id: s3.object.copy
  summary: Copy an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rename
  summary: Move an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rm
  summary: Delete an object
  safety: destructive
- id: s3.object.presign
  summary: Generate a time-limited URL for an object
  safety: write
  grant: true
- id: s3.bucket.download
  summary: Copy a bucket to a local directory, for a person at a terminal
  safety: write
- id: s3.bucket.upload
  summary: Copy a local directory into a bucket, for a person at a terminal
  safety: destructive
