  sha256: 02855bf7dbe117a22f81b16c7fea2e772d4b3f6862bc32edb33be918e2d1a11d
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.1/rta-plugin-s3_0.3.1_linux_amd64.tar.gz
  sha256: 5def1af31461412e5b00f024d4e692fa7f0d8b23c4db6724ec3f8f89d8df52a9
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.1/rta-plugin-s3_0.3.1_linux_arm64.tar.gz
  sha256: 78eafebdea5409d336f2e4b8db342572e596240c6030914c7ea1123a32968b16
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.1/rta-plugin-s3_0.3.1_windows_amd64.tar.gz
  sha256: 17ee9633902294903357102aabc94a65fdd009bd953988967d80fde2f3c7aa58
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.1/rta-plugin-s3_0.3.1_windows_arm64.tar.gz
  sha256: 68694f75f51af588c1374bfa27f17e973a2b18348d86071021aa85a0eeda8667
  bin: rta-plugin-s3.exe
capabilities:
- id: s3.overview
  summary: Endpoint and bucket count at a glance
  safety: read
- id: s3.bucket.list
  summary: List every bucket the configured credentials can see
  safety: read
- id: s3.policy.get
  summary: Show a bucket's policy document
  safety: read
- id: s3.object.list
  summary: List objects in a bucket
  safety: read
- id: s3.object.tree
  summary: The shape of a bucket in one call, with objects and bytes per prefix
  safety: read
- id: s3.object.show
  summary: Show one object's metadata — size, type, etag — never its content
  safety: read
- id: s3.object.get
  summary: Download an object's content
  safety: write
  grant: true
- id: s3.object.set
  summary: Upload (or overwrite) an object
  safety: write
  grant: true
- id: s3.object.copy
  summary: Copy an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rename
  summary: Move an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rm
  summary: Delete an object
  safety: destructive
- id: s3.object.presign
  summary: Generate a time-limited URL for an object
  safety: write
  grant: true
- id: s3.bucket.download
  summary: Copy a bucket to a local directory, for a person at a terminal
  safety: write
- id: s3.bucket.upload
  summary: Copy a local directory into a bucket, for a person at a terminal
  safety: destructive
