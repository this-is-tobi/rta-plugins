  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.4.3/rta-plugin-s3_0.4.3_linux_arm64.tar.gz
  sha256: 83edf5a36cebf2dab7f9767ea300657802e72bcae659e5163c73d508b5465cd3
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.4.3/rta-plugin-s3_0.4.3_windows_amd64.tar.gz
  sha256: f3400e62bbd5b350664a51d8fe3e736f10b158b77a3ecda235d2d1ec5facc990
