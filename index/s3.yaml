  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.13/rta-plugin-s3_0.3.13_windows_amd64.tar.gz
  sha256: aeae38d7cbd886110d622b280ff5a6f771a62e63a25b245814b368a8280ec225
