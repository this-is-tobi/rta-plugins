  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.4.1/rta-plugin-s3_0.4.1_windows_amd64.tar.gz
  sha256: 22d0d2dd17d4b56a5d60c338513d320e35dc5095cdd2b936fd1ef85acf7bc57f
