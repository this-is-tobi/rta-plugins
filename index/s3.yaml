# rta-plugin-s3, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: s3
version: 0.5.1
summary: "S3-compatible object storage: buckets, objects, presigned URLs and policy"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/s3
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.5.1/rta-plugin-s3_0.5.1_darwin_amd64.tar.gz
  sha256: 13d52d1af69922b5e5bb3e3c578287c55aa3ed62cb85c593bdbeacb74f1ca117
  bin: rta-plugin-s3
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.5.1/rta-plugin-s3_0.5.1_darwin_arm64.tar.gz
  sha256: c3793783cd32001cac343ae67ddb5fc88f62ce44f1e093d2a8edde38ec859b65
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.5.1/rta-plugin-s3_0.5.1_linux_amd64.tar.gz
  sha256: accc854496895be0508eb0aacd2048a85ea6afc4f207662bf37fb098354f973c
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.5.1/rta-plugin-s3_0.5.1_linux_arm64.tar.gz
  sha256: 4bb2bf492b6778fa63857c2f0245d845633736c0f55901899dbbd265b696f323
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.5.1/rta-plugin-s3_0.5.1_windows_amd64.tar.gz
  sha256: 6904b8e48bf4b82886ac285b5a28e29d9780246af53418f2bdb3da4bbb4df60e
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.5.1/rta-plugin-s3_0.5.1_windows_arm64.tar.gz
