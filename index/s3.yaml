  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.10/rta-plugin-s3_0.3.10_linux_arm64.tar.gz
  sha256: d39515de289dce334ef6edcef055c83ad029cdd62db423d51d54d9695132ddc7
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.10/rta-plugin-s3_0.3.10_windows_amd64.tar.gz
  sha256: 46f9f92f123b8117105b8d0bcd6752fe2a1610645e108d71bb0dd64436f59ce0
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.10/rta-plugin-s3_0.3.10_windows_arm64.tar.gz
