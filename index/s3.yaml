  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.6/rta-plugin-s3_0.3.6_linux_arm64.tar.gz
  sha256: 687f8ab529a904dece0b41e1a1408efd7a2efc3f586fb0f0c012efc459e9fef2
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.6/rta-plugin-s3_0.3.6_windows_amd64.tar.gz
  sha256: 0fe9ae952277b24aa9a386e31dc8ddba1c511f4bdaa3d46d69cbaeca4832788a
