# rta-plugin-s3, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: s3
version: 0.6.1
summary: "S3-compatible object storage: buckets, objects, presigned URLs and policy"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/s3
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.1/rta-plugin-s3_0.6.1_darwin_amd64.tar.gz
  sha256: a3d1fc220487ea4171024e0654ddaeaba547b7d4b0114a3b8ca92239d1b5175c
  bin: rta-plugin-s3
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.1/rta-plugin-s3_0.6.1_darwin_arm64.tar.gz
  sha256: 315a296b9685911cbf3bec6ca7e76dab441c52321cf58a06f8d4545f2d12b007
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.1/rta-plugin-s3_0.6.1_linux_amd64.tar.gz
  sha256: ec0d3044eb11e3de8f394c255a51e9a6713fd9b4096134feff12d26b2fd21972
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.1/rta-plugin-s3_0.6.1_linux_arm64.tar.gz
  sha256: 6136854ce141d517b376ff3097ff219529898f6376bfa6293c9745aebefbc040
  bin: rta-plugin-s3
capabilities:
- id: s3.overview
  summary: Endpoint and bucket count at a glance
  safety: read
- id: s3.bucket.list
  summary: List every bucket the configured credentials can see
  safety: read
- id: s3.policy.get
  summary: Show a bucket's policy document
  safety: read
- id: s3.object.list
  summary: List objects in a bucket
  safety: read
- id: s3.object.tree
  summary: The shape of a bucket in one call, with objects and bytes per prefix
  safety: read
- id: s3.object.show
  summary: Show one object's metadata — size, type, etag — never its content
  safety: read
- id: s3.object.get
  summary: Download an object's content
  safety: write
  grant: true
- id: s3.object.set
  summary: Upload (or overwrite) an object
  safety: write
  grant: true
- id: s3.object.copy
  summary: Copy an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rename
  summary: Move an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rm
  summary: Delete an object
  safety: destructive
- id: s3.object.presign
  summary: Generate a time-limited URL for an object
  safety: write
  grant: true
- id: s3.bucket.download
  summary: Copy a bucket to a local directory, for a person at a terminal
  safety: write
- id: s3.bucket.upload
  summary: Copy a local directory into a bucket, for a person at a terminal
  safety: destructive
