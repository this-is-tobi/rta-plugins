  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.14/rta-plugin-s3_0.3.14_darwin_arm64.tar.gz
  sha256: 242e638850ae6091fe34f0f51ed9b297c24268915f2c38621ec0e7a05146b4de
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.14/rta-plugin-s3_0.3.14_linux_amd64.tar.gz
  sha256: fd7bf34861b12f8da29015785a41bd704b380ec583ce2d15dc18f5efca277e08
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.14/rta-plugin-s3_0.3.14_linux_arm64.tar.gz
  sha256: 6e67ff564352d850be16cf2e01335edb8dc4299f005c69e3526252a70e8beedd
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.14/rta-plugin-s3_0.3.14_windows_amd64.tar.gz
  sha256: 394a955fa99a37af46eeba638fafa750fa42716a0fc9ace9940486c7723cde25
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.14/rta-plugin-s3_0.3.14_windows_arm64.tar.gz
