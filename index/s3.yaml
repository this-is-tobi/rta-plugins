  sha256: 52f2950c9456b67758ccd1256c37319a45453560f8d825d8b15beff72cce3e89
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.10/rta-plugin-s3_0.3.10_linux_amd64.tar.gz
  sha256: 7bb8dbe61aa5235686f20d74d8988e3a0a7ab003d5957f4f42c5e1002fee1a28
  bin: rta-plugin-s3
- os: linux
