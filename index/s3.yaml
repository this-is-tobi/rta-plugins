# rta-plugin-s3, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: s3
version: 0.6.3
summary: "S3-compatible object storage: buckets, objects, presigned URLs and policy"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/s3
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.3/rta-plugin-s3_0.6.3_darwin_amd64.tar.gz
  sha256: 2eb8d1770e5226529619d6194d494bbcb160c0332f0588a5bcdccf3db64b964e
  bin: rta-plugin-s3
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.3/rta-plugin-s3_0.6.3_darwin_arm64.tar.gz
  sha256: 1521dfdd3129c2334092a6a5b232a599b95b9d71d4f8a4742033f373e9fa4575
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.3/rta-plugin-s3_0.6.3_linux_amd64.tar.gz
  sha256: 5389a821379880ac41536353a81340e0475c070dbcc6d8dbc77e8cfdd4e8a376
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.6.3/rta-plugin-s3_0.6.3_linux_arm64.tar.gz
  sha256: 4a9a880f50c462de29b7daa7a9beb5a4fdf7ff3e055c18a4c03ccbe59d65ecc9
  bin: rta-plugin-s3
capabilities:
- id: s3.overview
  summary: Endpoint and bucket count at a glance
  safety: read
- id: s3.bucket.list
  summary: List every bucket the configured credentials can see
  safety: read
- id: s3.policy.get
  summary: Show a bucket's policy document
  safety: read
- id: s3.object.list
  summary: List objects in a bucket
  safety: read
- id: s3.object.tree
  summary: The shape of a bucket in one call, with objects and bytes per prefix
  safety: read
- id: s3.object.show
  summary: Show one object's metadata — size, type, etag — never its content
  safety: read
- id: s3.object.get
  summary: Download an object's content
  safety: write
  grant: true
- id: s3.object.set
  summary: Upload (or overwrite) an object
  safety: write
  grant: true
- id: s3.object.copy
  summary: Copy an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rename
  summary: Move an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rm
  summary: Delete an object
  safety: destructive
- id: s3.object.presign
  summary: Generate a time-limited URL for an object
  safety: write
  grant: true
- id: s3.bucket.download
  summary: Copy a bucket to a local directory, for a person at a terminal
  safety: write
- id: s3.bucket.upload
  summary: Copy a local directory into a bucket, for a person at a terminal
  safety: destructive
