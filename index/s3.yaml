  sha256: 6f294229b44d98ea28c053c71abe8d5c07c6a2fdc816d04a60f4fb16513fb110
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.4.2/rta-plugin-s3_0.4.2_linux_arm64.tar.gz
  sha256: d31dc705050f4367e1701a071198f220061f839bb9c6eae304b2c4ac7b7b429e
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.4.2/rta-plugin-s3_0.4.2_windows_amd64.tar.gz
  sha256: b7ddf2812160554893f54e0259fbf75621c5f554890d38f6a0c5ef1485865771
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.4.2/rta-plugin-s3_0.4.2_windows_arm64.tar.gz
