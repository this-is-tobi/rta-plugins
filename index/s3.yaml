# rta-plugin-s3, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: s3
version: 0.12.2
summary: "S3-compatible object storage: buckets, objects, presigned URLs and policy"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/s3
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.12.2/rta-plugin-s3_0.12.2_darwin_amd64.tar.gz
  sha256: b51d10f849e1cdf71c5f40dfcfc177c9bd6d0f21491e2574ae1e296cce14b83d
  bin: rta-plugin-s3
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.12.2/rta-plugin-s3_0.12.2_darwin_arm64.tar.gz
  sha256: a25351868f2ae6330436020a33948dfa741d7220704c8db745c93d3c804a1005
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.12.2/rta-plugin-s3_0.12.2_linux_amd64.tar.gz
  sha256: ba356f2950fbdc01f916db93c15d55530ca3560c02379c3a71e1ecf1e192e762
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.12.2/rta-plugin-s3_0.12.2_linux_arm64.tar.gz
  sha256: ba9a3e3957167a61cd21dc4cdbd5140904b9ccea285898dc0c64273ca6e2fdbc
  bin: rta-plugin-s3
capabilities:
- id: s3.overview
  summary: Whether an endpoint or a bucket is healthy, at a glance
  safety: read
- id: s3.bucket.list
  summary: List every bucket the configured credentials can see
  safety: read
- id: s3.policy.get
  summary: Show a bucket's policy document
  safety: read
- id: s3.object.list
  summary: List objects in a bucket
  safety: read
- id: s3.object.tree
  summary: The shape of a bucket in one call, with objects and bytes per prefix
  safety: read
- id: s3.object.show
  summary: Show one object's metadata — size, type, etag — never its content
  safety: read
- id: s3.object.get
  summary: Download an object's content
  safety: write
  grant: true
- id: s3.object.set
  summary: Upload (or overwrite) an object
  safety: write
  grant: true
- id: s3.object.copy
  summary: Copy an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rename
  summary: Move an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rm
  summary: Delete an object
  safety: destructive
- id: s3.object.presign
  summary: Generate a time-limited URL for an object
  safety: write
  grant: true
- id: s3.bucket.download
  summary: Copy a bucket to a local directory, for a person at a terminal
  safety: write
- id: s3.bucket.upload
  summary: Copy a local directory into a bucket, for a person at a terminal
  safety: destructive
