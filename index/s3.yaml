  sha256: 11c935532df689f563960dbb54b77f4f25662febbdc6e5183de8420bcd29b8c1
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.11/rta-plugin-s3_0.3.11_linux_amd64.tar.gz
  sha256: 01f0bbd73b7ed59b44bede684b65844a92a1100fe928c93167d27813f05fbdd3
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.11/rta-plugin-s3_0.3.11_linux_arm64.tar.gz
  sha256: 35e9f7051b958736fe17b680ba5382f2ae243c102700b27739998be24a32a8c5
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.11/rta-plugin-s3_0.3.11_windows_amd64.tar.gz
  sha256: 8863c51a9fe646885f6f42773da3fc52757160465232cf989ed2d7404c115323
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.11/rta-plugin-s3_0.3.11_windows_arm64.tar.gz
  sha256: f6ed2966782f8a8926b8b6ce0c3bfb2f13389330f1e5df4f6bb49f99e96b7c85
