  sha256: e0dea300a1a658df5cc86d81c8d4c205f052f1d171ef3944ac4b64528c5d05b8
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.5/rta-plugin-s3_0.3.5_linux_arm64.tar.gz
  sha256: 8d6729916f7c5d9db7a555f110763dd995a69015d721014e6b6108761b96d73f
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.5/rta-plugin-s3_0.3.5_windows_amd64.tar.gz
  sha256: 86d733d0126c5201e42bf9dfd73a53b7b9324be3e60602b0062fb531e68f318c
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.5/rta-plugin-s3_0.3.5_windows_arm64.tar.gz
