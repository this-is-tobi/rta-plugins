# rta-plugin-s3, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: s3
version: 0.13.1
summary: "S3-compatible object storage: buckets, objects, presigned URLs and policy"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/s3
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.13.1/rta-plugin-s3_0.13.1_darwin_amd64.tar.gz
  sha256: 70e95910563743b75c053861126405fb94c92631359a6bd6f706a5f1ac794572
  bin: rta-plugin-s3
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.13.1/rta-plugin-s3_0.13.1_darwin_arm64.tar.gz
  sha256: f89e0610590fe0589f25884401ea9a08f49bba7ca4ac0d3b61eacee29314594e
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.13.1/rta-plugin-s3_0.13.1_linux_amd64.tar.gz
  sha256: f77e818cddf07b442bc3fc11c9009f3fc626190c927cc5ba2fcf518c7245ee24
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.13.1/rta-plugin-s3_0.13.1_linux_arm64.tar.gz
  sha256: 147bfbcbb878bf91647e8d6c9f7ae905d0cb6ebb1451a07a1de1add60f41bafc
  bin: rta-plugin-s3
capabilities:
- id: s3.overview
  summary: Whether an endpoint or a bucket is healthy, at a glance
  safety: read
- id: s3.bucket.list
  summary: List every bucket the configured credentials can see
  safety: read
- id: s3.policy.get
  summary: Show a bucket's policy document
  safety: read
- id: s3.object.list
  summary: List objects in a bucket
  safety: read
- id: s3.object.tree
  summary: The shape of a bucket in one call, with objects and bytes per prefix
  safety: read
- id: s3.object.show
  summary: Show one object's metadata — size, type, etag — never its content
  safety: read
- id: s3.object.get
  summary: Download an object's content
  safety: write
  grant: true
- id: s3.object.set
  summary: Upload (or overwrite) an object
  safety: write
  grant: true
- id: s3.object.copy
  summary: Copy an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rename
  summary: Move an object to a new bucket/key
  safety: write
  grant: true
- id: s3.object.rm
  summary: Delete an object
  safety: destructive
- id: s3.object.presign
  summary: Generate a time-limited URL for an object
  safety: write
  grant: true
- id: s3.bucket.download
  summary: Copy a bucket to a local directory, for a person at a terminal
  safety: write
- id: s3.bucket.upload
  summary: Copy a local directory into a bucket, for a person at a terminal
  safety: destructive
