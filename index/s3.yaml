  sha256: cade42927c39492d93be924e0000f38d5754a4ab10954045a993f73ddb220858
  bin: rta-plugin-s3
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.2.1/rta-plugin-s3_0.2.1_linux_amd64.tar.gz
  sha256: d174239808beea904c0e65f066a98ef32a71342d213d4657c356d62a5f69e9f6
  bin: rta-plugin-s3
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.2.1/rta-plugin-s3_0.2.1_linux_arm64.tar.gz
  sha256: 222c099965c44177d8585cabef1fc44d64a1cf9663dfae1af2260e71d7767506
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.2.1/rta-plugin-s3_0.2.1_windows_amd64.tar.gz
  sha256: ef8c51fda1aef7df07b0c1bd07ea3879a556cea66ff61f83492df25649fc801d
  bin: rta-plugin-s3.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.2.1/rta-plugin-s3_0.2.1_windows_arm64.tar.gz
