  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.12/rta-plugin-s3_0.3.12_linux_arm64.tar.gz
  sha256: 3d3fe501df9990a4a10c8367296cb50a71d22493c2628c505dcaba79956be50b
  bin: rta-plugin-s3
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fs3%2Fv0.3.12/rta-plugin-s3_0.3.12_windows_amd64.tar.gz
  sha256: 21cd019b04b7f697060ccfdb0af46b8993c89ade67e95b050651f575e5bcd1f3
  bin: rta-plugin-s3.exe
- os: windows
