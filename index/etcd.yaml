# rta-plugin-etcd, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: etcd
version: 0.6.2
summary: "etcd v3: cluster health, members, leases and the keyspace"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/etcd
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.6.2/rta-plugin-etcd_0.6.2_darwin_amd64.tar.gz
  sha256: c5e25b1112e5ca78240327d66df7703770f9fb66b342d8b79ccbaf51e86e99bd
  bin: rta-plugin-etcd
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.6.2/rta-plugin-etcd_0.6.2_darwin_arm64.tar.gz
  sha256: 4ebdb377e91e837dc725c86f1696dc6087b4184818052b1152040bfb1896e75f
  bin: rta-plugin-etcd
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.6.2/rta-plugin-etcd_0.6.2_linux_amd64.tar.gz
  sha256: 916555b5361eda0af216f3eb9c633a393c60563c118e218a2230c2f1ad5a717e
  bin: rta-plugin-etcd
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.6.2/rta-plugin-etcd_0.6.2_linux_arm64.tar.gz
  sha256: f4032c396a21f9db09829fdbc31dd244fd4401baa65570b62327eaf46de4cd11
  bin: rta-plugin-etcd
capabilities:
- id: etcd.overview
  summary: Whether this cluster is healthy, and what it is made of
  safety: read
- id: etcd.member.list
  summary: Who is in this cluster, and how each one is reachable
  safety: read
- id: etcd.lease.list
  summary: Outstanding leases and how long each has left
  safety: read
- id: etcd.kv.list
  summary: Key names under a prefix — never their contents
  safety: read
- id: etcd.kv.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: etcd.kv.get
  summary: What one key holds
  safety: write
  grant: true
- id: etcd.snapshot
  summary: Write a point-in-time snapshot of the whole keyspace, for a person at a terminal
  safety: write
