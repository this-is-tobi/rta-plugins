  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.3.10/rta-plugin-etcd_0.3.10_windows_amd64.tar.gz
  sha256: 1ffb840323ab67094770158db1403a3cf44a26a199c74e7df0d81cfd49522716
