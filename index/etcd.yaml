- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.1.0/rta-plugin-etcd_0.1.0_windows_arm64.tar.gz
  sha256: 69fc787af0a2678bcb5fde75ec6ab2e43d3af265cf64db7f4d390a4a1ba2edf5
