# rta-plugin-etcd, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: etcd
version: 0.10.3
summary: "etcd v3: cluster health, members, leases and the keyspace"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/etcd
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.10.3/rta-plugin-etcd_0.10.3_darwin_amd64.tar.gz
  sha256: 2f8732c43d8a63ec3f860c39b590fad77213c2547c4723133bc32fd2ecd07266
  bin: rta-plugin-etcd
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.10.3/rta-plugin-etcd_0.10.3_darwin_arm64.tar.gz
  sha256: 6da4a1df09795746fdfdbbf9e43f29a75bcebbb1db46a65c59f23c1a8254be09
  bin: rta-plugin-etcd
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.10.3/rta-plugin-etcd_0.10.3_linux_amd64.tar.gz
  sha256: 6e443611a94c9cfacde31c2db696c4ad60f772641cfd9a0c9d3462e1cb49bf98
  bin: rta-plugin-etcd
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.10.3/rta-plugin-etcd_0.10.3_linux_arm64.tar.gz
  sha256: edcbd63b0a52fbeea2b4da3f8faa51302b8fa9eb852a8ba73a50360679247fae
  bin: rta-plugin-etcd
capabilities:
- id: etcd.overview
  summary: Whether this cluster is healthy, and what it is made of
  safety: read
- id: etcd.member.list
  summary: Who is in this cluster, and how each one is reachable
  safety: read
- id: etcd.lease.list
  summary: Outstanding leases and how long each has left
  safety: read
- id: etcd.kv.list
  summary: Key names under a prefix — never their contents
  safety: read
- id: etcd.kv.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: etcd.kv.get
  summary: What one key holds
  safety: write
  grant: true
- id: etcd.snapshot
  summary: Write a point-in-time snapshot of the whole keyspace, for a person at a terminal
  safety: write
