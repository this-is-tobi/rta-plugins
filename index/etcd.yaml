# rta-plugin-etcd, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: etcd
version: 0.8.2
summary: "etcd v3: cluster health, members, leases and the keyspace"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/etcd
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.2/rta-plugin-etcd_0.8.2_darwin_amd64.tar.gz
  sha256: 438ec4819cb506b086617c10953c794225ce1757da13e3b31849475901896bd3
  bin: rta-plugin-etcd
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.2/rta-plugin-etcd_0.8.2_darwin_arm64.tar.gz
  sha256: 2406379feefcbc20565d015a26b3b3f21dd54eea605b4e0287e7d055af5bc5f3
  bin: rta-plugin-etcd
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.2/rta-plugin-etcd_0.8.2_linux_amd64.tar.gz
  sha256: 9ad7a68ca62d4ca5f2b6cb434a2323e95b488e9af2a99ebeca684d3570aa4bad
  bin: rta-plugin-etcd
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.2/rta-plugin-etcd_0.8.2_linux_arm64.tar.gz
  sha256: e072d0e84e0b97f04dd6f20a197cbcc1eef643636d1a463fef15a1ebe4c6cb86
  bin: rta-plugin-etcd
capabilities:
- id: etcd.overview
  summary: Whether this cluster is healthy, and what it is made of
  safety: read
- id: etcd.member.list
  summary: Who is in this cluster, and how each one is reachable
  safety: read
- id: etcd.lease.list
  summary: Outstanding leases and how long each has left
  safety: read
- id: etcd.kv.list
  summary: Key names under a prefix — never their contents
  safety: read
- id: etcd.kv.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: etcd.kv.get
  summary: What one key holds
  safety: write
  grant: true
- id: etcd.snapshot
  summary: Write a point-in-time snapshot of the whole keyspace, for a person at a terminal
  safety: write
