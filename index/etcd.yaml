# rta-plugin-etcd, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: etcd
version: 0.11.2
summary: "etcd v3: cluster health, members, leases and the keyspace"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/etcd
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.11.2/rta-plugin-etcd_0.11.2_darwin_amd64.tar.gz
  sha256: d9fbe4b6b3304c9c50884de63fe27c939d91af4b1197abfec71d84fe93340829
  bin: rta-plugin-etcd
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.11.2/rta-plugin-etcd_0.11.2_darwin_arm64.tar.gz
  sha256: d9cdbd64a9acae3ca5a48ee7d9e0191235e54f9322dddab46ce0c1f461db7dc7
  bin: rta-plugin-etcd
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.11.2/rta-plugin-etcd_0.11.2_linux_amd64.tar.gz
  sha256: 00d3d7c9ef10c3972ec68dc835afe35200c9f617de50cef9d03ede0fafe57243
  bin: rta-plugin-etcd
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.11.2/rta-plugin-etcd_0.11.2_linux_arm64.tar.gz
  sha256: 90759900b323c0e8a515d12d6968fed61c71b6a69c8abf4681ffe493b5202360
  bin: rta-plugin-etcd
capabilities:
- id: etcd.overview
  summary: Whether this cluster is healthy, and what it is made of
  safety: read
- id: etcd.member.list
  summary: Who is in this cluster, and how each one is reachable
  safety: read
- id: etcd.lease.list
  summary: Outstanding leases and how long each has left
  safety: read
- id: etcd.kv.list
  summary: Key names under a prefix — never their contents
  safety: read
- id: etcd.kv.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: etcd.kv.get
  summary: What one key holds
  safety: write
  grant: true
- id: etcd.snapshot
  summary: Write a point-in-time snapshot of the whole keyspace, for a person at a terminal
  safety: write
