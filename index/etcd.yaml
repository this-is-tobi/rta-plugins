  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.4.0/rta-plugin-etcd_0.4.0_windows_amd64.tar.gz
  sha256: 1d6be95f4704f57ee3143fb13128dfa6c439ed3c9fe6ce6d3128a715fae1b54b
