# rta-plugin-etcd, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: etcd
version: 0.8.1
summary: "etcd v3: cluster health, members, leases and the keyspace"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/etcd
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.1/rta-plugin-etcd_0.8.1_darwin_amd64.tar.gz
  sha256: 145aad7df675d2742a17ba0c17d491d027e741d75d46b3ea4bd55724187d5d60
  bin: rta-plugin-etcd
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.1/rta-plugin-etcd_0.8.1_darwin_arm64.tar.gz
  sha256: 5835fd0c9b0a74249c103a821df5734f20abdaddfa115d5758e9601b5a48fc2c
  bin: rta-plugin-etcd
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.1/rta-plugin-etcd_0.8.1_linux_amd64.tar.gz
  sha256: c1cfb14094b58c211cffb3f4b9b7fed1a94ce2e9c7c62263d166b49fa580daab
  bin: rta-plugin-etcd
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fetcd%2Fv0.8.1/rta-plugin-etcd_0.8.1_linux_arm64.tar.gz
  sha256: 9f69778aa2349dd0195fc86d36c76e028cf540c55fcbff02ad49b310a71213cd
  bin: rta-plugin-etcd
capabilities:
- id: etcd.overview
  summary: Whether this cluster is healthy, and what it is made of
  safety: read
- id: etcd.member.list
  summary: Who is in this cluster, and how each one is reachable
  safety: read
- id: etcd.lease.list
  summary: Outstanding leases and how long each has left
  safety: read
- id: etcd.kv.list
  summary: Key names under a prefix — never their contents
  safety: read
- id: etcd.kv.tree
  summary: The shape of the keyspace in one call — names only
  safety: read
- id: etcd.kv.get
  summary: What one key holds
  safety: write
  grant: true
- id: etcd.snapshot
  summary: Write a point-in-time snapshot of the whole keyspace, for a person at a terminal
  safety: write
