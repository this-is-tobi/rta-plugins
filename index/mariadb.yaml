  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.4/rta-plugin-mariadb_0.12.4_darwin_arm64.tar.gz
  sha256: 1d4d9a4a298c3ed55ffe787d773eb4e9c98e33f7728512102fa776f2e8512049
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.4/rta-plugin-mariadb_0.12.4_linux_amd64.tar.gz
  sha256: e24525ac93a1d5e09a346e125a4fd733cebe1ca9ad22fed2a1a93ff7c97b61b8
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.4/rta-plugin-mariadb_0.12.4_linux_arm64.tar.gz
  sha256: 011b6d8ca4ed7f9ada3787dd279bf06fa7dc89f4846b197f298dd421cd35bdc7
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
