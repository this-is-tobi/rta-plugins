  sha256: 21bdb0c9f344d0a92c35b41c62960066db0ad83c5f594a1878e4668093f95834
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.6.1/rta-plugin-mariadb_0.6.1_linux_arm64.tar.gz
  sha256: 5755a67a93fbbbaa681e6fa8911b9c5701d690ff2d7b14126204c3721a6e6f64
