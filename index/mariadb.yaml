  sha256: ebed8e62939d7ea01bbae6f6d520c2981fbf814d6448aeda2b7f512b7941428a
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.7.4/rta-plugin-mariadb_0.7.4_linux_amd64.tar.gz
  sha256: d9a1c3ab3bfccfb649e5209d0306130f986101586b3a46a4c2a4f28d087a1017
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.7.4/rta-plugin-mariadb_0.7.4_linux_arm64.tar.gz
  sha256: 0516fad5c53da53a6c0ea5ed99cef8a55648ee5c57c17843d25319f82f0c9070
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
