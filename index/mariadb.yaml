  sha256: 363e1ac49b041fea4da2ea96d6c484bc1c6793ac09232e25be6f35acb46f3e2a
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.8.2/rta-plugin-mariadb_0.8.2_linux_amd64.tar.gz
  sha256: f392349c418d6e437f0cf76aacac14e8351c350646803a7178f4f5fbc5ef5705
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.8.2/rta-plugin-mariadb_0.8.2_linux_arm64.tar.gz
  sha256: e8258b8376aab62f5a60d234331d7f6fca381489cfb78e8a3bb0adc47634079f
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
