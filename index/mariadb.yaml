  sha256: b060906b344d661033dde4dd2d2a16994c68c4e4de6d90ca074202c49621a62a
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.7.2/rta-plugin-mariadb_0.7.2_linux_arm64.tar.gz
  sha256: 2884886c5d5082cabd77f627f430b4df805aa6bdaef19889c0d2ce3f639b2028
