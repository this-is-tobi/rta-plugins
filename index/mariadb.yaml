  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.11.4/rta-plugin-mariadb_0.11.4_darwin_arm64.tar.gz
  sha256: e91e2a5fe7e54bed355163fcbdc920d7821dec13f0201681d63427af73a8159f
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.11.4/rta-plugin-mariadb_0.11.4_linux_amd64.tar.gz
  sha256: 42343ffa75866dcec8e28dd90ad7b87d2339e7227cd889316a6a17195ca34d77
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.11.4/rta-plugin-mariadb_0.11.4_linux_arm64.tar.gz
  sha256: acc239da5155d9765ad07fa134c3f0710b37e7b1f76c8daff5b0e1b2c692c601
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
