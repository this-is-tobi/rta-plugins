# rta-plugin-mariadb, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: mariadb
version: 0.12.0
summary: "MariaDB: connection health, schema, rows, activity, replication and cluster state"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/mariadb
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.0/rta-plugin-mariadb_0.12.0_darwin_amd64.tar.gz
  sha256: a7641f54d6ba31820495f317852ee8ac6b73e02b2a7af1a1d22e5c6cb6bdd47a
  bin: rta-plugin-mariadb
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.0/rta-plugin-mariadb_0.12.0_darwin_arm64.tar.gz
  sha256: 9bef8de8ee5c7174c842fbd2842b1d1bd2bdab649943016d8222a29b9f82e8c7
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.0/rta-plugin-mariadb_0.12.0_linux_amd64.tar.gz
  sha256: 5182ab379fee6222be75743cd22525539300671070f016300e9cc4bde8bd354f
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.0/rta-plugin-mariadb_0.12.0_linux_arm64.tar.gz
  sha256: 6d4fa917e4b8e8f19c03db29c3535eb41cc50b5e93db1147f15adabff8d826da
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
