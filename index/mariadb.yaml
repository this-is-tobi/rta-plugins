  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.11.1/rta-plugin-mariadb_0.11.1_darwin_arm64.tar.gz
  sha256: dcc70c76820380b2a15f20d76444cba0d743e8fcd254b4148f0a3cc1b4a1216c
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.11.1/rta-plugin-mariadb_0.11.1_linux_amd64.tar.gz
  sha256: 6945ebe7fb0869314e2129a8e7595e034917a4de5a5c6cb8df17cdac030fa02b
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.11.1/rta-plugin-mariadb_0.11.1_linux_arm64.tar.gz
  sha256: bed72a981bd8c80fbbe5cc9ffe7fdb74ad665a5df523bb25244d113c03342201
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
