  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.7.3/rta-plugin-mariadb_0.7.3_darwin_arm64.tar.gz
  sha256: 5e7c54b2ef5baa34c3fc5274ad3916a62693328a0551c89742d8f6f067861fea
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.7.3/rta-plugin-mariadb_0.7.3_linux_amd64.tar.gz
  sha256: ca6f1b17bae5c9eb17cb1998c8f04287774d1263c94d6da58294c9d7162d909b
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.7.3/rta-plugin-mariadb_0.7.3_linux_arm64.tar.gz
  sha256: 34b6685cbd3bf21cf0f6af8b856843dd8537b4f9f4434d30eb6005f3db520e42
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
