  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.7/rta-plugin-mariadb_0.12.7_darwin_arm64.tar.gz
  sha256: ac1b9e2aaa212795d17baa01111fd4cff2bb3f1df4cbdd35df408a43215e7986
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.7/rta-plugin-mariadb_0.12.7_linux_amd64.tar.gz
  sha256: 036d16324145ca224aae3cb858cb284864916976bdd5b7dbbcd21490280f0e23
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.7/rta-plugin-mariadb_0.12.7_linux_arm64.tar.gz
  sha256: c85c85b8a6d852f0b9b0522d2e2d8553195eac9143998e7091d2cf8918640513
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
