  sha256: ab69c024e5cb8d021706ba9839e824fa765f2feea430c2dfb8f0883f4ff00979
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.13.1/rta-plugin-mariadb_0.13.1_linux_amd64.tar.gz
  sha256: 4838c9043c19adaf735e6f2fb1a030e322250b55ca90173fb7f578b70c99a80a
  bin: rta-plugin-mariadb
- os: linux
