  sha256: 5d3f396374887964773dd13811ef971674a8f8cace0de2ddcf0ce30e9ef52c27
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.13.2/rta-plugin-mariadb_0.13.2_linux_amd64.tar.gz
  sha256: f4cc62f8d4ad5b6965d583c4e8d18d216b91bfc85152128ab199881b1f96baa5
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.13.2/rta-plugin-mariadb_0.13.2_linux_arm64.tar.gz
  sha256: cb48e152c8aa662b087d22ffe578b0d6584579aa164dd86093da858ac531ef27
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
