  sha256: c1bd9ba81fc30a34cda46c1a3e3c9d103abaeb946328b4eb5d240c5d6ba96594
  bin: rta-plugin-mariadb
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.6/rta-plugin-mariadb_0.12.6_linux_amd64.tar.gz
  sha256: 7d1e7ef7ce3f0c4223e62f56cf50e88fe055d4a2d61407b49fe8857a8ad3abb0
  bin: rta-plugin-mariadb
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmariadb%2Fv0.12.6/rta-plugin-mariadb_0.12.6_linux_arm64.tar.gz
  sha256: e6c0b7b628957fe11aa63bf3585b8e57f8b91a791f983f8e77d59f008c8d6ea3
  bin: rta-plugin-mariadb
capabilities:
- id: mariadb.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mariadb.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mariadb.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mariadb.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mariadb.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mariadb.query
  summary: Run a read-only query
  safety: write
- id: mariadb.activity
  summary: What every connected session is doing right now
  safety: write
- id: mariadb.replication.status
  summary: "Replication and Galera state in one place: role, lag, positions, replicas, cluster"
  safety: read
- id: mariadb.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mariadb.restore
  summary: Restore a mariadb.dump file into a database, for a person at a terminal
  safety: destructive
