  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.10/rta-plugin-vault_0.4.10_linux_arm64.tar.gz
  sha256: 45d23f3de1116d95b57a23982f79c1ace9326a09b54eafb6c44cd60b20b1c158
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.10/rta-plugin-vault_0.4.10_windows_amd64.tar.gz
  sha256: 1dbc5b40a4ef5d160a07d41cc39367179af2f181e95868adf73a9a2efe27b49d
