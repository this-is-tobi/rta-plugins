  sha256: fe2dbc7baf60afab4e15bccf4cda10e4449ef7107847dee23f8cc96381e6a30f
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.11/rta-plugin-vault_0.4.11_linux_arm64.tar.gz
  sha256: 46687b685c2ad62818d05f65bbfcc55e3dd6d13be9c4d7e53bba33deed833072
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.11/rta-plugin-vault_0.4.11_windows_amd64.tar.gz
  sha256: 50367b2acd03cf40faccc1cf4462857bb1d74f96b2587da5ab03e070a185e183
