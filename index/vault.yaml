- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.9/rta-plugin-vault_0.4.9_windows_arm64.tar.gz
  sha256: 42ae5c62f4cbc598d5be92176dac3ca3225f9c8a4f89217fc91d89b027ae6d86
