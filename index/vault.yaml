  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.15/rta-plugin-vault_0.4.15_windows_amd64.tar.gz
  sha256: 19df4ce3e88fafcf858d3e3191918565ed85d3f80728d37a6afac915df798f8a
