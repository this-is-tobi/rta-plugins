  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.6/rta-plugin-vault_0.4.6_linux_arm64.tar.gz
  sha256: dee12a4afbfb2f698fd2c84604029153f5f4c4915e8f2c1d33dd3293f33baab1
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.6/rta-plugin-vault_0.4.6_windows_amd64.tar.gz
  sha256: f2203a7da3ff3549cc8486071bce749dca6072cfbaa7793e7f3a2fb670154372
