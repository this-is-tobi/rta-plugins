# rta-plugin-vault, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: vault
version: 0.9.4
summary: "HashiCorp Vault: secrets, tokens, leases, policies and transit encryption"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/vault
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.9.4/rta-plugin-vault_0.9.4_darwin_amd64.tar.gz
  sha256: 8d9615f3d90d9a5aa39dba8a9e7845881e5c399c8d4bd59923a926d4e89494e9
  bin: rta-plugin-vault
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.9.4/rta-plugin-vault_0.9.4_darwin_arm64.tar.gz
  sha256: f5f9872d382604a9d31a7b77618d58a536edaad4f135d014caac3efad164e926
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.9.4/rta-plugin-vault_0.9.4_linux_amd64.tar.gz
  sha256: d548c9b487e1afddf01ce5f91417b3e871f5d9022ee955a96e58bbf958b55998
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.9.4/rta-plugin-vault_0.9.4_linux_arm64.tar.gz
  sha256: 368d93c137d065f7a18619177eb7a57f0f2784f2a2d9256e9c675e3e1ccb758c
  bin: rta-plugin-vault
capabilities:
- id: vault.overview
  summary: Whether this Vault serves, and what the token can do
  safety: read
- id: vault.seal.status
  summary: Whether Vault is initialized, sealed, and what it takes to unseal it
  safety: read
- id: vault.kv.list
  summary: List secret names at a path — never values
  safety: read
- id: vault.kv.tree
  summary: The whole shape of a KV mount in one call — names only
  safety: read
- id: vault.kv.get
  summary: Reveal a secret's current version, or an earlier one
  safety: write
  grant: true
- id: vault.kv.set
  summary: Set (or overwrite) a secret
  safety: write
  grant: true
- id: vault.kv.history
  summary: A secret's versions — which is current, which are deleted or destroyed — never values
  safety: read
- id: vault.kv.delete
  summary: Delete a secret's current version, or the versions named — undoable
  safety: write
  grant: true
- id: vault.kv.undelete
  summary: Bring back deleted versions of a secret
  safety: write
  grant: true
- id: vault.kv.destroy
  summary: Destroy versions of a secret for good, for a person at a terminal
  safety: destructive
- id: vault.token.status
  summary: What the current token can do, and when it expires
  safety: read
- id: vault.lease.show
  summary: A lease's TTL and renewability
  safety: read
- id: vault.policy.list
  summary: Every ACL policy defined on this Vault
  safety: read
- id: vault.policy.get
  summary: One policy's own rules, as HCL
  safety: read
- id: vault.transit.encrypt
  summary: Encrypt caller-supplied plaintext with a Vault-managed key
  safety: write
- id: vault.transit.decrypt
  summary: Decrypt ciphertext back to its plaintext
  safety: write
  grant: true
- id: vault.wrap.set
  summary: Wrap data into a single-use, TTL'd token
  safety: write
  grant: true
- id: vault.wrap.get
  summary: Unwrap a single-use token, once
  safety: write
  grant: true
- id: vault.snapshot
  summary: Write a raft storage snapshot, for a person at a terminal
  safety: write
- id: vault.restore
  summary: Restore a vault.snapshot file into a Vault, for a person at a terminal
  safety: destructive
