  sha256: 58072688e628069a9db6709ecbc9ab231109f7d257f9e0cd52d78e32167fe71c
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.5/rta-plugin-vault_0.4.5_linux_arm64.tar.gz
  sha256: 458029b55c612f7e9dc5c779814bff8c545e957c4087c6a455fe064dcfa1faf7
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.5/rta-plugin-vault_0.4.5_windows_amd64.tar.gz
  sha256: 83bb29d10334623f20a94fa1047dfeb6ac46ce7bbf0d93e619ce69451a77440f
