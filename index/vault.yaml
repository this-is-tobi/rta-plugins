# rta-plugin-vault, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: vault
version: 0.2.0
summary: "HashiCorp Vault: secrets, tokens, leases, policies and transit encryption"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/vault
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.0/rta-plugin-vault_0.2.0_darwin_amd64.tar.gz
  sha256: bac9c93d7feb9441635f4b8c6af20405cd605d7c49ddf0b52d1dddc76254f4c2
  bin: rta-plugin-vault
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.0/rta-plugin-vault_0.2.0_darwin_arm64.tar.gz
  sha256: c45873c7244b69f069d69fd7e246da86056d6d44c7f534a2eb5a8f327118121c
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.0/rta-plugin-vault_0.2.0_linux_amd64.tar.gz
  sha256: 8e857be503fd1144b3a8fe5bbddb3e91b45f1390fd8eca7cc381d0adb68bf0a9
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.0/rta-plugin-vault_0.2.0_linux_arm64.tar.gz
  sha256: b33085ffb709328acb4e30fbf50eb5021e11166f26df322eaa107d0dff01a400
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.0/rta-plugin-vault_0.2.0_windows_amd64.tar.gz
  sha256: e51d83c3dadb7d14bb3ab85b75c90377e1dfc3ce68c0ddbd7d812a5e15d47edc
  bin: rta-plugin-vault.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.0/rta-plugin-vault_0.2.0_windows_arm64.tar.gz
  sha256: 1da24b7a24ff58fadbf9d92ab3f26725cde370710a7852a8194ed597ca146d68
  bin: rta-plugin-vault.exe
capabilities:
- id: vault.overview
  summary: Seal state, the current token and the policy list at a glance
  safety: read
- id: vault.seal.status
  summary: Whether Vault is initialized, sealed, and what it takes to unseal it
  safety: read
- id: vault.kv.list
  summary: List secret names at a path — never values
  safety: read
- id: vault.kv.tree
  summary: The whole shape of a KV mount in one call — names only
  safety: read
- id: vault.kv.get
  summary: Reveal a secret's current version
  safety: write
  grant: true
- id: vault.kv.set
  summary: Set (or overwrite) a secret
  safety: write
  grant: true
- id: vault.token.status
  summary: What the current token can do, and when it expires
  safety: read
- id: vault.lease.show
  summary: A lease's TTL and renewability
  safety: read
- id: vault.policy.list
  summary: Every ACL policy defined on this Vault
  safety: read
- id: vault.policy.get
  summary: One policy's own rules, as HCL
  safety: read
- id: vault.transit.encrypt
  summary: Encrypt caller-supplied plaintext with a Vault-managed key
  safety: write
- id: vault.transit.decrypt
  summary: Decrypt ciphertext back to its plaintext
  safety: write
  grant: true
- id: vault.wrap.set
  summary: Wrap data into a single-use, TTL'd token
  safety: write
  grant: true
- id: vault.wrap.get
  summary: Unwrap a single-use token, once
  safety: write
  grant: true
- id: vault.snapshot
  summary: Write a raft storage snapshot, for a person at a terminal
  safety: write
- id: vault.restore
  summary: Restore a vault.snapshot file into a Vault, for a person at a terminal
  safety: destructive
