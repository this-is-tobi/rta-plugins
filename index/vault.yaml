- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.1/rta-plugin-vault_0.5.1_windows_arm64.tar.gz
  sha256: 0b4b79ff2100a85472158dd43ef7f7047859ba9a8a3c06ee1b55f52d9959c9cc
