  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.9/rta-plugin-vault_0.4.9_linux_arm64.tar.gz
  sha256: 752c657a984bac4ba0b61399bdda21109fe3846ab31c5797e3cc674c8a7cc06b
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.9/rta-plugin-vault_0.4.9_windows_amd64.tar.gz
  sha256: 442ee7b9c9152739fdde3d59b90fbdb9d78b1867698db4e1c403ebb3facc5c51
