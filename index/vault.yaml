  sha256: 029e9acea79453ccf359609915428dcfe9514d1573773d5c9401f0d963cbe228
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.2/rta-plugin-vault_0.4.2_linux_amd64.tar.gz
  sha256: 96ca9e4e845f4d6bac6dbab65eeb7d8d6c9db40b5712534862cbdfc47c4f5039
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.2/rta-plugin-vault_0.4.2_linux_arm64.tar.gz
  sha256: c55fafe0ead3fb6fd0c710b709977eea9646722e06ca3f507e138a6d1bc131b4
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.2/rta-plugin-vault_0.4.2_windows_amd64.tar.gz
  sha256: fd1b36111b29ee8ffa72b6906dd46536625a3e7d0c3714f18de83bfd0e7fc928
