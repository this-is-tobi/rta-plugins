- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.5/rta-plugin-vault_0.4.5_windows_arm64.tar.gz
  sha256: 811f0b6baebf9ac07fe9758752b8d164120ea27860387e6e545316c3872b0985
