- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.2/rta-plugin-vault_0.3.2_windows_arm64.tar.gz
  sha256: c46757523be206ba6b9d5ed172fb6b59c11095f6f98697039b56f285dab628ce
