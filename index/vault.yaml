  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.10/rta-plugin-vault_0.4.10_windows_arm64.tar.gz
  sha256: d1e364ea04eade1aafb1f99e8603175d787e0359db71367be31671e79404c2cd
