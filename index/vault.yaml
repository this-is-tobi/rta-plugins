  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.4/rta-plugin-vault_0.4.4_linux_amd64.tar.gz
  sha256: 7388c276ab00adfcd5b80b042500c5f5356a9ae4ddc9f57a3b896a896bc446f1
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.4/rta-plugin-vault_0.4.4_linux_arm64.tar.gz
  sha256: b2a732ae07332c325bde33f5e3c9fab762c517ecb23c118b3654e2f93c311c6e
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.4/rta-plugin-vault_0.4.4_windows_amd64.tar.gz
  sha256: 15835c537db3111d1a6c738ecb0ef4f55459f860270a2beaa43e17fa452a4f89
