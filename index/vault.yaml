# rta-plugin-vault, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: vault
version: 0.3.2
summary: "HashiCorp Vault: secrets, tokens, leases, policies and transit encryption"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/vault
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.2/rta-plugin-vault_0.3.2_darwin_amd64.tar.gz
  sha256: 9b4913cc28fe29979dc7c9fe2d0c418eb9b9f5cdbf85329cbfedcf4661f5bdc3
  bin: rta-plugin-vault
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.2/rta-plugin-vault_0.3.2_darwin_arm64.tar.gz
  sha256: 677709825283de88524d8f86b90225798f030f9594ad1cf153d89cc0b16a2a50
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.2/rta-plugin-vault_0.3.2_linux_amd64.tar.gz
  sha256: cb8df9e08e92825e1ecc72207ee8b3d93e8e85b7c0c3bae791c2c50dd0a27748
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.2/rta-plugin-vault_0.3.2_linux_arm64.tar.gz
  sha256: 28cd0a1600da2b9ea17fe0771b2c86d62d406e78d0698a037f9d1c09e3038158
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.2/rta-plugin-vault_0.3.2_windows_amd64.tar.gz
  sha256: 1fd358040095f3f2b02791356a0228ab03500890d9949cba5b78de6c8f732163
