# rta-plugin-vault, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: vault
version: 0.2.1
summary: "HashiCorp Vault: secrets, tokens, leases, policies and transit encryption"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/vault
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.1/rta-plugin-vault_0.2.1_darwin_amd64.tar.gz
  sha256: 04f16ba371bbdb93f38c5623eaabba8dd16f549be58f96557bca7cd2405b8170
  bin: rta-plugin-vault
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.1/rta-plugin-vault_0.2.1_darwin_arm64.tar.gz
  sha256: 2e2c4920db364b7266499fcffcb4a39d8d2961dbd65e10f4d227a0b8de4cbe76
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.1/rta-plugin-vault_0.2.1_linux_amd64.tar.gz
  sha256: c08f7f9f593a49bb1d9c5d47486aa2a51b9d86f7b79a9c63b61b3962407a1aa5
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.1/rta-plugin-vault_0.2.1_linux_arm64.tar.gz
  sha256: aafacc2b5b5e299571f8870041519ca23c8809cb07b1ff590b35308ebb806324
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.1/rta-plugin-vault_0.2.1_windows_amd64.tar.gz
  sha256: 0477d62afb83d5b29243a45450db381e1ae18454e8c1135cb3e8476501f86b03
  bin: rta-plugin-vault.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.2.1/rta-plugin-vault_0.2.1_windows_arm64.tar.gz
  sha256: af3653d1302f321cc2f4f598ce3fe7be689eee39709abf294326fc8af90bdf02
  bin: rta-plugin-vault.exe
capabilities:
- id: vault.overview
  summary: Seal state, the current token and the policy list at a glance
  safety: read
- id: vault.seal.status
  summary: Whether Vault is initialized, sealed, and what it takes to unseal it
  safety: read
- id: vault.kv.list
  summary: List secret names at a path — never values
  safety: read
- id: vault.kv.tree
  summary: The whole shape of a KV mount in one call — names only
  safety: read
- id: vault.kv.get
  summary: Reveal a secret's current version
  safety: write
  grant: true
- id: vault.kv.set
  summary: Set (or overwrite) a secret
  safety: write
  grant: true
- id: vault.token.status
  summary: What the current token can do, and when it expires
  safety: read
- id: vault.lease.show
  summary: A lease's TTL and renewability
  safety: read
- id: vault.policy.list
  summary: Every ACL policy defined on this Vault
  safety: read
- id: vault.policy.get
  summary: One policy's own rules, as HCL
  safety: read
- id: vault.transit.encrypt
  summary: Encrypt caller-supplied plaintext with a Vault-managed key
  safety: write
- id: vault.transit.decrypt
  summary: Decrypt ciphertext back to its plaintext
  safety: write
  grant: true
- id: vault.wrap.set
  summary: Wrap data into a single-use, TTL'd token
  safety: write
  grant: true
- id: vault.wrap.get
  summary: Unwrap a single-use token, once
  safety: write
  grant: true
- id: vault.snapshot
  summary: Write a raft storage snapshot, for a person at a terminal
  safety: write
- id: vault.restore
  summary: Restore a vault.snapshot file into a Vault, for a person at a terminal
  safety: destructive
