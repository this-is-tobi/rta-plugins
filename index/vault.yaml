  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.0/rta-plugin-vault_0.4.0_linux_amd64.tar.gz
  sha256: c7faf868d5a2d9c0f63f401569a59cd75e00bd74c855d4689c325d4141d1f267
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.0/rta-plugin-vault_0.4.0_linux_arm64.tar.gz
  sha256: c3cfc2bfb13d38aacc9a52565721fc19ceade5e60fae7192f9a890784ad55289
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.0/rta-plugin-vault_0.4.0_windows_amd64.tar.gz
  sha256: 7c46c12f4348162f2931093a4a10da20c41a0f9eef66164c6700d85fea85cfe7
