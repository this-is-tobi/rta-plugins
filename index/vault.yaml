  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.7/rta-plugin-vault_0.4.7_linux_arm64.tar.gz
  sha256: 9172aded290d6bdad6c5c1d1a25e42274efabaed2cc90d0441fb458eae77675b
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.7/rta-plugin-vault_0.4.7_windows_amd64.tar.gz
  sha256: 059fe2d8c49482a679bffffab8b92a0dd58de5dafcf83132c28bf7d5aab4b1f0
