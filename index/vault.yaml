  sha256: 92b4fc3e4d721cb6bc7357bdd036296cceb9cf6ba721515e72664be9a7c1c4bd
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.13/rta-plugin-vault_0.4.13_linux_arm64.tar.gz
  sha256: 75616aabcb4b11fc9d47e9734226ac80fa4b5d9dc3e096d3e5d900ba848523b2
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.13/rta-plugin-vault_0.4.13_windows_amd64.tar.gz
  sha256: 3d9375bcb67947c0dc1d0c22b806b024e88965a4488a6bfd3939cc8db45e6dd0
