  sha256: 5fea2b44d5ff9013ee92fabda1c510505a510d1c7fc01c327bc5c8a1cacacd1a
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.14/rta-plugin-vault_0.4.14_linux_arm64.tar.gz
  sha256: 7b3f05109c35829719eb978d1a0fce0d5d9fd9f181e77f0ff30ad3b1c39f3d57
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.14/rta-plugin-vault_0.4.14_windows_amd64.tar.gz
  sha256: 22047f8d1d061fb19bcabaf950339c51d0f0ff7479aa3bd57fcb8cfb98f2657d
