  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.12/rta-plugin-vault_0.4.12_linux_arm64.tar.gz
  sha256: 9ac19066b19f0cc28e4a55e0ac85b153210526c2985f3563fdde9c8a24d6f8be
  bin: rta-plugin-vault
