  sha256: 0dda5f3e07667b7370741030952f84c06b589c5a4bb93e14def52b26c83e9945
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.1/rta-plugin-vault_0.4.1_linux_arm64.tar.gz
  sha256: 9e17cee37cbf7037ec383c8aa8c828c0ba5fa7e5086fce3733b64e9bc92ed008
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.1/rta-plugin-vault_0.4.1_windows_amd64.tar.gz
  sha256: 68aa1af88e12e7b369bc1c30524359853cd7062bd3339f5fba760f2277453825
