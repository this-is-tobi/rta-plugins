  sha256: bc23009e6d5e0148c8de901cac00a398cf88294c2e00366159dbe6f4066af64d
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.1/rta-plugin-vault_0.3.1_linux_amd64.tar.gz
  sha256: 6d27333e3d24e2dcd043a1e354f1b3fc0959d2797a36741e2b35902b074eb3d8
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.1/rta-plugin-vault_0.3.1_linux_arm64.tar.gz
  sha256: e93c191b99ea6a78061e3017012d28c548e10a9a72dd36930c5828c10ec6b6d4
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.1/rta-plugin-vault_0.3.1_windows_amd64.tar.gz
  sha256: daf306e640e501f514429a510bb003be2ee0f15658f3b61c0ab0170ebb561b5e
  bin: rta-plugin-vault.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.3.1/rta-plugin-vault_0.3.1_windows_arm64.tar.gz
  sha256: d1bdb552afe0f39b1395ad584519a120ac0b5c8fee06215f605db07d0aa89e84
  bin: rta-plugin-vault.exe
capabilities:
- id: vault.overview
  summary: Seal state, the current token and the policy list at a glance
  safety: read
- id: vault.seal.status
  summary: Whether Vault is initialized, sealed, and what it takes to unseal it
  safety: read
- id: vault.kv.list
  summary: List secret names at a path — never values
  safety: read
- id: vault.kv.tree
  summary: The whole shape of a KV mount in one call — names only
  safety: read
- id: vault.kv.get
  summary: Reveal a secret's current version
  safety: write
  grant: true
- id: vault.kv.set
  summary: Set (or overwrite) a secret
  safety: write
  grant: true
- id: vault.token.status
  summary: What the current token can do, and when it expires
  safety: read
- id: vault.lease.show
  summary: A lease's TTL and renewability
  safety: read
- id: vault.policy.list
  summary: Every ACL policy defined on this Vault
  safety: read
- id: vault.policy.get
  summary: One policy's own rules, as HCL
  safety: read
- id: vault.transit.encrypt
  summary: Encrypt caller-supplied plaintext with a Vault-managed key
  safety: write
- id: vault.transit.decrypt
  summary: Decrypt ciphertext back to its plaintext
  safety: write
  grant: true
- id: vault.wrap.set
  summary: Wrap data into a single-use, TTL'd token
  safety: write
  grant: true
- id: vault.wrap.get
  summary: Unwrap a single-use token, once
  safety: write
  grant: true
- id: vault.snapshot
  summary: Write a raft storage snapshot, for a person at a terminal
  safety: write
- id: vault.restore
  summary: Restore a vault.snapshot file into a Vault, for a person at a terminal
  safety: destructive
