  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.15/rta-plugin-vault_0.4.15_linux_arm64.tar.gz
  sha256: e0eb0c8df9937aa633f8e55596ccf01c831935035690bb7b0c68ddff57c21d1f
  bin: rta-plugin-vault
- os: windows
