# rta-plugin-vault, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: vault
version: 0.4.16
summary: "HashiCorp Vault: secrets, tokens, leases, policies and transit encryption"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/vault
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.16/rta-plugin-vault_0.4.16_darwin_amd64.tar.gz
  sha256: 3f6f412ca425bd8fecc9a3d4abafe909321840cb9a65ef86be5443998da0abcc
  bin: rta-plugin-vault
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.16/rta-plugin-vault_0.4.16_darwin_arm64.tar.gz
  sha256: 754cfe36ad4917f6504fc20ff4e23f77460c410f7c9f30e52067ade72e31c1ae
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.16/rta-plugin-vault_0.4.16_linux_amd64.tar.gz
  sha256: 327cba2af27f916bcc2dbbce870cc23aa9cb43415814c2f38a957950b6e4a32c
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.16/rta-plugin-vault_0.4.16_linux_arm64.tar.gz
  sha256: 06316bf483d4875b7296d825eb4321967e0e699f6e05635b15a352ab65d5677f
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.16/rta-plugin-vault_0.4.16_windows_amd64.tar.gz
  sha256: d6ef7ac8e26a15530824a81f87b9c05f3b6e76e152a7e84352fda0a453707618
  bin: rta-plugin-vault.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.16/rta-plugin-vault_0.4.16_windows_arm64.tar.gz
  sha256: 6dcf4ca4b31f9b8e6fede7179d1e287ffe2cec33cefdccc917e8a23bc1dcdcb7
  bin: rta-plugin-vault.exe
capabilities:
- id: vault.overview
  summary: Seal state, the current token and the policy list at a glance
  safety: read
- id: vault.seal.status
  summary: Whether Vault is initialized, sealed, and what it takes to unseal it
  safety: read
- id: vault.kv.list
  summary: List secret names at a path — never values
  safety: read
- id: vault.kv.tree
  summary: The whole shape of a KV mount in one call — names only
  safety: read
- id: vault.kv.get
  summary: Reveal a secret's current version, or an earlier one
  safety: write
  grant: true
- id: vault.kv.set
  summary: Set (or overwrite) a secret
  safety: write
  grant: true
- id: vault.kv.history
  summary: A secret's versions — which is current, which are deleted or destroyed — never values
  safety: read
- id: vault.kv.delete
  summary: Delete a secret's current version, or the versions named — undoable
  safety: write
  grant: true
- id: vault.kv.undelete
  summary: Bring back deleted versions of a secret
  safety: write
  grant: true
- id: vault.kv.destroy
  summary: Destroy versions of a secret for good, for a person at a terminal
  safety: destructive
- id: vault.token.status
  summary: What the current token can do, and when it expires
  safety: read
- id: vault.lease.show
  summary: A lease's TTL and renewability
  safety: read
- id: vault.policy.list
  summary: Every ACL policy defined on this Vault
  safety: read
- id: vault.policy.get
  summary: One policy's own rules, as HCL
  safety: read
- id: vault.transit.encrypt
  summary: Encrypt caller-supplied plaintext with a Vault-managed key
  safety: write
- id: vault.transit.decrypt
  summary: Decrypt ciphertext back to its plaintext
  safety: write
  grant: true
- id: vault.wrap.set
  summary: Wrap data into a single-use, TTL'd token
  safety: write
  grant: true
- id: vault.wrap.get
  summary: Unwrap a single-use token, once
  safety: write
  grant: true
- id: vault.snapshot
  summary: Write a raft storage snapshot, for a person at a terminal
  safety: write
- id: vault.restore
  summary: Restore a vault.snapshot file into a Vault, for a person at a terminal
  safety: destructive
