  sha256: ecf46bf64d01db8a634b2838e133547b354efa6d90a4c2b92c097298ea8ad74c
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.1/rta-plugin-vault_0.5.1_linux_amd64.tar.gz
  sha256: 4a9bc61a946aa985550cacce8d34e9d882e1cff24c8296d984505bd9974419c9
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.1/rta-plugin-vault_0.5.1_linux_arm64.tar.gz
  sha256: ec839f6031b468a37c084ec77f7e55e9bdcb2f62a7a684e557efb6a7e36c7547
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.1/rta-plugin-vault_0.5.1_windows_amd64.tar.gz
  sha256: f710ab773f5f6c31c2ec385ea8052a52fca2c0845ff8032ae458a1d062e37cb6
