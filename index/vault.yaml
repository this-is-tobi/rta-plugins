- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.11/rta-plugin-vault_0.4.11_windows_arm64.tar.gz
  sha256: f4acb9c98cc299f183cd91e7a38f2a8dff9dd12307297afe194987749db2f456
