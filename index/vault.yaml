  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.8/rta-plugin-vault_0.4.8_linux_amd64.tar.gz
  sha256: 41e6b2298e27f2fbf529973310025b495d9e5b56d0daf7dcc96246ae41bc7e0a
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.8/rta-plugin-vault_0.4.8_linux_arm64.tar.gz
  sha256: 9aa3184f452a9cb4fac0c3b26ac44e6472b67f7aaa43f5c9a1be7f85319fff1f
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.8/rta-plugin-vault_0.4.8_windows_amd64.tar.gz
  sha256: 62bf12eaae309bb76b40d31b294565bd8607dff5887a227e3eb613ffe2bbbc75
