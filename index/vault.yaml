# rta-plugin-vault, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: vault
version: 0.5.0
summary: "HashiCorp Vault: secrets, tokens, leases, policies and transit encryption"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/vault
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.0/rta-plugin-vault_0.5.0_darwin_amd64.tar.gz
  sha256: cc4dcff43cb98ce45740a8d373e902dcc2422cde5c00c3e56a59061844499202
  bin: rta-plugin-vault
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.0/rta-plugin-vault_0.5.0_darwin_arm64.tar.gz
  sha256: 1591d9a6e003644456fb6e1f7a27ce0fbf274c36e2a963905e9388fd73ec9b1e
  bin: rta-plugin-vault
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.0/rta-plugin-vault_0.5.0_linux_amd64.tar.gz
  sha256: f261fab703cf683813dee966ba13cfe08e7c1ed626953673f29af75de3245b33
  bin: rta-plugin-vault
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.0/rta-plugin-vault_0.5.0_linux_arm64.tar.gz
  sha256: efb2048dd4086d591228091dc5a1c7881a26e4a4129b6ebc9d71fc0367c1f737
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.0/rta-plugin-vault_0.5.0_windows_amd64.tar.gz
  sha256: 4fe3af68e1b7afc6043565f633cbb01f3a55427a8d943e185ea54111b817b1a3
  bin: rta-plugin-vault.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.5.0/rta-plugin-vault_0.5.0_windows_arm64.tar.gz
  sha256: 0241aa55d91dac2a6c160758e07f4f88bcebc550c2e478b72e3eeaf545998551
  bin: rta-plugin-vault.exe
capabilities:
- id: vault.overview
  summary: Seal state, the current token and the policy list at a glance
  safety: read
- id: vault.seal.status
  summary: Whether Vault is initialized, sealed, and what it takes to unseal it
  safety: read
- id: vault.kv.list
  summary: List secret names at a path — never values
  safety: read
- id: vault.kv.tree
  summary: The whole shape of a KV mount in one call — names only
  safety: read
- id: vault.kv.get
  summary: Reveal a secret's current version, or an earlier one
  safety: write
  grant: true
- id: vault.kv.set
  summary: Set (or overwrite) a secret
  safety: write
  grant: true
- id: vault.kv.history
  summary: A secret's versions — which is current, which are deleted or destroyed — never values
  safety: read
- id: vault.kv.delete
  summary: Delete a secret's current version, or the versions named — undoable
  safety: write
  grant: true
- id: vault.kv.undelete
  summary: Bring back deleted versions of a secret
  safety: write
  grant: true
- id: vault.kv.destroy
  summary: Destroy versions of a secret for good, for a person at a terminal
  safety: destructive
- id: vault.token.status
  summary: What the current token can do, and when it expires
  safety: read
- id: vault.lease.show
  summary: A lease's TTL and renewability
  safety: read
- id: vault.policy.list
  summary: Every ACL policy defined on this Vault
  safety: read
- id: vault.policy.get
  summary: One policy's own rules, as HCL
  safety: read
- id: vault.transit.encrypt
  summary: Encrypt caller-supplied plaintext with a Vault-managed key
  safety: write
- id: vault.transit.decrypt
  summary: Decrypt ciphertext back to its plaintext
  safety: write
  grant: true
- id: vault.wrap.set
  summary: Wrap data into a single-use, TTL'd token
  safety: write
  grant: true
- id: vault.wrap.get
  summary: Unwrap a single-use token, once
  safety: write
  grant: true
- id: vault.snapshot
  summary: Write a raft storage snapshot, for a person at a terminal
  safety: write
- id: vault.restore
  summary: Restore a vault.snapshot file into a Vault, for a person at a terminal
  safety: destructive
