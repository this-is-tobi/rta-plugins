- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.1/rta-plugin-vault_0.4.1_windows_arm64.tar.gz
  sha256: 94a3eda8ac0525aabed1fff744822ac378ba9aaf919d8f6a6c70ee41b940696f
