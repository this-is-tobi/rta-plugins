  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.9/rta-plugin-vault_0.4.9_linux_amd64.tar.gz
  sha256: 2f42d456e11975585a71632582b7d10e4119a1c645840f2b79f77ebb42ad93f9
  bin: rta-plugin-vault
- os: linux
