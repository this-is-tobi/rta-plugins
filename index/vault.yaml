  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.17/rta-plugin-vault_0.4.17_linux_arm64.tar.gz
  sha256: e1bd0f5c60f26262fb7aff6e1569d599b965db6f8bb3fb0fa1bafc5a52009b15
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.17/rta-plugin-vault_0.4.17_windows_amd64.tar.gz
  sha256: cd8507043c0666430efade365a5fde75b2efac9024e17abc718312db106fc7bd
