  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.12/rta-plugin-vault_0.4.12_windows_amd64.tar.gz
  sha256: c65179fd2a96315af924c4a7a1ff3ef7a0a538ce836a780bc1faa17ce437676d
