  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.3/rta-plugin-vault_0.4.3_linux_arm64.tar.gz
  sha256: 81594e6193967ba6fecc43f244b241a22753a49a3150aa5da2a189e1db7b01d5
  bin: rta-plugin-vault
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.3/rta-plugin-vault_0.4.3_windows_amd64.tar.gz
  sha256: 1de06f23c9b60e336a260dcfa372767b637d4c5031f550d682b31fde26350667
