- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fvault%2Fv0.4.7/rta-plugin-vault_0.4.7_windows_arm64.tar.gz
  sha256: 73e7bbae5ee85fe61f8e1a7074ef5a0ec559c791c661015461b104842dccf56b
