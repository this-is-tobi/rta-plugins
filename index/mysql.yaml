# rta-plugin-mysql, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: mysql
version: 0.7.4
summary: "MySQL: connection health, schema, rows, activity and replication"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/mysql
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmysql%2Fv0.7.4/rta-plugin-mysql_0.7.4_darwin_amd64.tar.gz
  sha256: d787916087752eb141ba5104a0da79df3e75673f4db7f3950926c12295fe3db4
  bin: rta-plugin-mysql
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmysql%2Fv0.7.4/rta-plugin-mysql_0.7.4_darwin_arm64.tar.gz
  sha256: 23fec8286be2f40fb779db65b018eb8d614d392c461e2f8d0b67de914a0ee36b
  bin: rta-plugin-mysql
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmysql%2Fv0.7.4/rta-plugin-mysql_0.7.4_linux_amd64.tar.gz
  sha256: 8ef1242bcb0a14646071902dbc7a852d3b28319189fb0c148ec2b92e90077f3d
  bin: rta-plugin-mysql
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fmysql%2Fv0.7.4/rta-plugin-mysql_0.7.4_linux_arm64.tar.gz
  sha256: 2e06f02ff3cea5b41c798bf5faba9eae8c1626b08883774ea9936d0d4279b3bf
  bin: rta-plugin-mysql
capabilities:
- id: mysql.overview
  summary: Everything about this connection at a glance
  safety: read
- id: mysql.status
  summary: Whether the database answers, and what it is
  safety: read
- id: mysql.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: mysql.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: mysql.schema
  summary: Describe a database's tables, columns and keys — no values
  safety: read
- id: mysql.query
  summary: Run a read-only query
  safety: write
- id: mysql.activity
  summary: What every connected session is doing right now
  safety: write
- id: mysql.replication.status
  summary: "Replication and Group Replication state in one place: role, lag, positions, replicas, group"
  safety: read
- id: mysql.dump
  summary: Back up one database to a SQL file, for a person at a terminal
  safety: write
- id: mysql.restore
  summary: Restore a mysql.dump file into a database, for a person at a terminal
  safety: destructive
