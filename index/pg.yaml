# rta-plugin-pg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: pg
version: 0.13.2
summary: "PostgreSQL: connection health, replication, schema, rows and activity"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/pg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.13.2/rta-plugin-pg_0.13.2_darwin_amd64.tar.gz
  sha256: a39584500dfc28b98b0b47c8565007fc49fed1f8758e874a579989bb8eac5708
  bin: rta-plugin-pg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.13.2/rta-plugin-pg_0.13.2_darwin_arm64.tar.gz
  sha256: 47e9d41e1ec75fd79f9b08ff6520bbc4c55bbf0720d5e387c24df96401c37ff1
  bin: rta-plugin-pg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.13.2/rta-plugin-pg_0.13.2_linux_amd64.tar.gz
  sha256: 207aabe2af7f4496beefa305e873d2956b17a986a60aacbc3005e919ae17618e
  bin: rta-plugin-pg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.13.2/rta-plugin-pg_0.13.2_linux_arm64.tar.gz
  sha256: 033a1fa5325a09d2d57ac3b6abd2bfafd009751fa9ff7527a88d62128186110d
  bin: rta-plugin-pg
capabilities:
- id: pg.status
  summary: Whether the database answers, and what it is
  safety: read
- id: pg.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: pg.query
  summary: Run a read-only query
  safety: write
- id: pg.schema
  summary: Describe a schema's tables, columns and keys — no values
  safety: read
- id: pg.table.rows
  summary: Read every row of one named table
  safety: write
  grant: true
- id: pg.dump
  summary: Back up the whole database to a file, for a person at a terminal
  safety: write
- id: pg.restore
  summary: Restore a pg.dump backup into a database, for a person at a terminal
  safety: destructive
- id: pg.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: pg.activity
  summary: What every connected session is doing right now
  safety: write
- id: pg.replication.status
  summary: Where every member of the replication is, and how far behind
  safety: read
- id: pg.overview
  summary: Everything about this connection at a glance
  safety: read
