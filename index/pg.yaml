# rta-plugin-pg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: pg
version: 0.17.0
summary: "PostgreSQL: connection health, replication, schema, rows and activity"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/pg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.17.0/rta-plugin-pg_0.17.0_darwin_amd64.tar.gz
  sha256: 9c2ea5618a654def5dc2115a3fe23cf9db3f2891fcf9796c46d595d7ca23a7a1
  bin: rta-plugin-pg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.17.0/rta-plugin-pg_0.17.0_darwin_arm64.tar.gz
  sha256: e637402fd13fc869b5a17ee1c52b34127dec38f7f63e6daee77384c507355e63
  bin: rta-plugin-pg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.17.0/rta-plugin-pg_0.17.0_linux_amd64.tar.gz
  sha256: c091b7d38c1a4f3c7a8554bdd674d0d25af6b240ef4b784cdcb9240c7e5f2c48
  bin: rta-plugin-pg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.17.0/rta-plugin-pg_0.17.0_linux_arm64.tar.gz
  sha256: 0b2aefe25ba55891200b84b1b4426b652016d506c93003933aa5f11fffb766d4
  bin: rta-plugin-pg
capabilities:
- id: pg.status
  summary: Whether the database answers, and what it is
  safety: read
- id: pg.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: pg.query
  summary: Run a read-only query
  safety: write
- id: pg.schema
  summary: Describe a schema's tables, columns and keys — no values
  safety: read
- id: pg.table.rows
  summary: Read every row of one named table
  safety: write
  grant: true
- id: pg.dump
  summary: Back up the whole database to a file, for a person at a terminal
  safety: write
- id: pg.restore
  summary: Restore a pg.dump backup into a database, for a person at a terminal
  safety: destructive
- id: pg.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: pg.activity
  summary: What every connected session is doing right now
  safety: write
- id: pg.replication.status
  summary: Where every member of the replication is, and how far behind
  safety: read
- id: pg.overview
  summary: Everything about this connection at a glance
  safety: read
