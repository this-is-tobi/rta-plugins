# rta-plugin-pg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: pg
version: 0.14.1
summary: "PostgreSQL: connection health, replication, schema, rows and activity"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/pg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.14.1/rta-plugin-pg_0.14.1_darwin_amd64.tar.gz
  sha256: 85ffa864b5ef1cb8414f86447f030a0f3cb1b3d012e0e2d387ba73edfafd9d7e
  bin: rta-plugin-pg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.14.1/rta-plugin-pg_0.14.1_darwin_arm64.tar.gz
  sha256: c6472018fa4d6d763e74bb6bc3f5b5b963f031f5813fc8fe70b1e4386893f7e3
  bin: rta-plugin-pg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.14.1/rta-plugin-pg_0.14.1_linux_amd64.tar.gz
  sha256: 24afa8678ad27476e407999764040eac0d13c58689af2e907859f61b20f83f0c
  bin: rta-plugin-pg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.14.1/rta-plugin-pg_0.14.1_linux_arm64.tar.gz
  sha256: d3cbb1981c7549a9349e972487e2fd34edb96ca63a6cec73b394dad9a2193b1d
  bin: rta-plugin-pg
capabilities:
- id: pg.status
  summary: Whether the database answers, and what it is
  safety: read
- id: pg.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: pg.query
  summary: Run a read-only query
  safety: write
- id: pg.schema
  summary: Describe a schema's tables, columns and keys — no values
  safety: read
- id: pg.table.rows
  summary: Read every row of one named table
  safety: write
  grant: true
- id: pg.dump
  summary: Back up the whole database to a file, for a person at a terminal
  safety: write
- id: pg.restore
  summary: Restore a pg.dump backup into a database, for a person at a terminal
  safety: destructive
- id: pg.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: pg.activity
  summary: What every connected session is doing right now
  safety: write
- id: pg.replication.status
  summary: Where every member of the replication is, and how far behind
  safety: read
- id: pg.overview
  summary: Everything about this connection at a glance
  safety: read
