  sha256: acfbc750b5541882159da31953225459dc9bc287cb4a8bd92d09588eef4a1974
  bin: rta-plugin-pg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.2.0/rta-plugin-pg_0.2.0_windows_amd64.tar.gz
  sha256: 45a8e310497427759ca15e86a7ef4c4783ff2bdeae1898abb6773e6b0b84de57
