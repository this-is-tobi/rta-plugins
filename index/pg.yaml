# rta-plugin-pg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: pg
version: 0.8.0
summary: "PostgreSQL: connection health, replication, schema, rows and activity"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/pg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.8.0/rta-plugin-pg_0.8.0_darwin_amd64.tar.gz
  sha256: e29bbdea2b0eba38f223674ea72344f56e9a711c2497b1a4aea548fa8c3b74d9
  bin: rta-plugin-pg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.8.0/rta-plugin-pg_0.8.0_darwin_arm64.tar.gz
  sha256: 8d4362a30b475ff07c4fdbace8627726d1f29166762e245830e527009a149194
  bin: rta-plugin-pg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.8.0/rta-plugin-pg_0.8.0_linux_amd64.tar.gz
  sha256: efb66f951d0b8e3f5e05fdecb281dc65b8e925dd4808f40b17d13767505e209b
  bin: rta-plugin-pg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.8.0/rta-plugin-pg_0.8.0_linux_arm64.tar.gz
  sha256: 231a8d5b1aaf63097be8ba1363b5635dc62543cbe7ea417261bf32d72500987b
  bin: rta-plugin-pg
capabilities:
- id: pg.status
  summary: Whether the database answers, and what it is
  safety: read
- id: pg.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: pg.query
  summary: Run a read-only query
  safety: write
- id: pg.schema.dump
  summary: Describe a schema's tables, columns and keys — no values
  safety: read
- id: pg.table.dump
  summary: Read every row of one named table
  safety: write
  grant: true
- id: pg.dump
  summary: Back up the whole database to a file, for a person at a terminal
  safety: write
- id: pg.restore
  summary: Restore a pg.dump backup into a database, for a person at a terminal
  safety: destructive
- id: pg.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: pg.activity
  summary: What every connected session is doing right now
  safety: write
- id: pg.replication
  summary: Where every member of the replication is, and how far behind
  safety: read
- id: pg.overview
  summary: Everything about this connection at a glance
  safety: read
