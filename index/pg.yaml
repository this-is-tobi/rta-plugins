# rta-plugin-pg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: pg
version: 0.7.1
summary: "PostgreSQL: connection health, replication, schema, rows and activity"
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/pg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.7.1/rta-plugin-pg_0.7.1_darwin_amd64.tar.gz
  sha256: 0ff9e6de28d6dc1a44422f90ea4bca962120eceafbce63cbb4f5e91d997e1b42
  bin: rta-plugin-pg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.7.1/rta-plugin-pg_0.7.1_darwin_arm64.tar.gz
  sha256: 6338b5d1a44ab5129c4f8ea1d392c8c9b9566bb155b4be4c4f148d128565b7c7
  bin: rta-plugin-pg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.7.1/rta-plugin-pg_0.7.1_linux_amd64.tar.gz
  sha256: 547046077ca2e8055d98edefa5606f309f02b017a5e4c6fdf608036b6c3f78a8
  bin: rta-plugin-pg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fpg%2Fv0.7.1/rta-plugin-pg_0.7.1_linux_arm64.tar.gz
  sha256: 67bd4ad5319ad6558d0d9ed43733d8112ed70f2061b6770e51d2d671f39e7922
  bin: rta-plugin-pg
capabilities:
- id: pg.status
  summary: Whether the database answers, and what it is
  safety: read
- id: pg.table.list
  summary: List tables with their row estimates and sizes
  safety: read
- id: pg.query
  summary: Run a read-only query
  safety: write
- id: pg.schema.dump
  summary: Describe a schema's tables, columns and keys — no values
  safety: read
- id: pg.table.dump
  summary: Read every row of one named table
  safety: write
  grant: true
- id: pg.dump
  summary: Back up the whole database to a file, for a person at a terminal
  safety: write
- id: pg.restore
  summary: Restore a pg.dump backup into a database, for a person at a terminal
  safety: destructive
- id: pg.database.list
  summary: List databases on this server, with their sizes
  safety: read
- id: pg.activity
  summary: What every connected session is doing right now
  safety: write
- id: pg.replication
  summary: Where every member of the replication is, and how far behind
  safety: read
- id: pg.overview
  summary: Everything about this connection at a glance
  safety: read
