  sha256: e0b89ab49cb66fa8f2acee0642686decf2591cc3205a84dd34a5e48081ca31d2
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.3.0/rta-plugin-cnpg_0.3.0_linux_arm64.tar.gz
  sha256: d9d9ba7b5b1e54f2adc8aa34d542fa8c82c3f8a097ccf9a006908951bf318841
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.3.0/rta-plugin-cnpg_0.3.0_windows_amd64.tar.gz
  sha256: 2b722b92b7515cd62257e947aa0c16cac53f7192d4af2a6cc9d17f4a3b2edb85
