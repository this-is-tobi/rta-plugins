  sha256: 4176567a33173d101aaeae5f5732869e7293fa22f724649c1890102b13db7132
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.5/rta-plugin-cnpg_0.2.5_linux_arm64.tar.gz
  sha256: 331466716e9b7a440ed8ee06afeea96e6af0b40fe296c5d5f1cf4d89fc158943
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.5/rta-plugin-cnpg_0.2.5_windows_amd64.tar.gz
  sha256: 0ab2b26bffe9ba5045534a7f7e8ee3bd77692f1831edea6e3226f0f7ea040911
