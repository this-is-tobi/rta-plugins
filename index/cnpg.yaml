- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.19/rta-plugin-cnpg_0.2.19_windows_arm64.tar.gz
  sha256: 8448dbd5878246b5ae10b03ed2ea5e52f317564ca2b3b4b97486e5525fb4d61a
