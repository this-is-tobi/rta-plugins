  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.18/rta-plugin-cnpg_0.2.18_windows_amd64.tar.gz
  sha256: eb93a2c97c9118e47827f3be100899e82643e0a1688c1514178e3d66cf6b13f0
