  sha256: 708992ce64e4833fef79770de422cd6d639da6145b884b50f433ef5aa3186e87
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.11/rta-plugin-cnpg_0.2.11_linux_arm64.tar.gz
  sha256: 8c6a12ec4879389844afd9293ad692ab8ba257e083f791d391e3b4f1e827381e
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.11/rta-plugin-cnpg_0.2.11_windows_amd64.tar.gz
  sha256: d59c458d8f60e7c6ff1b534528b4421d8255783706d6db5fd528d02d20119c30
  bin: rta-plugin-cnpg.exe
- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.11/rta-plugin-cnpg_0.2.11_windows_arm64.tar.gz
  sha256: 9605bb797cae06103d23e8db4ef3e815b093c350c4b342f23b0b3375e1b7a80a
