  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.20/rta-plugin-cnpg_0.2.20_windows_amd64.tar.gz
  sha256: dcd45303d7ae8b795dd027653c25387d4161bcbebb1620c2c6c417489a6d0a82
