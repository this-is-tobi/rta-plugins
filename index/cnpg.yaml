# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.14.4
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.14.4/rta-plugin-cnpg_0.14.4_darwin_amd64.tar.gz
  sha256: dabbfa06b10b47b1291f8ba0688f5294c9e0777671e628416a45ab70576e22db
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.14.4/rta-plugin-cnpg_0.14.4_darwin_arm64.tar.gz
  sha256: 4cf12457f2f797537b3c61cd4b06dd2511f5a440decf19b7155025bb13834a8e
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.14.4/rta-plugin-cnpg_0.14.4_linux_amd64.tar.gz
  sha256: 3bb061dc359494db497ea3e57a8bbd0287a2012e0416f03cb48ea0655f090ef3
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.14.4/rta-plugin-cnpg_0.14.4_linux_arm64.tar.gz
  sha256: 829b070139968cea5e81f3f0efb725332d1ff2d8eb76c97a2d7bd88afb34b48e
  bin: rta-plugin-cnpg
capabilities:
- id: cnpg.list
  summary: Every CloudNativePG cluster, and whether it is healthy
  safety: read
- id: cnpg.status
  summary: "One cluster in depth: instances, replication, backups, storage"
  safety: read
- id: cnpg.backup.list
  summary: "Backups taken of a cluster: when, how, where they went, and what failed"
  safety: read
- id: cnpg.backup.show
  summary: "How one cluster's backups are set up and where they land: store, retention, schedules"
  safety: read
- id: cnpg.backup.request
  summary: Ask the operator to back a cluster up now, using that cluster's own configuration
  safety: write
  grant: true
- id: cnpg.storage
  summary: "The volumes a cluster's data and WAL sit on: size, class, and whether each one is actually bound"
  safety: read
needs:
- kubeconfig
