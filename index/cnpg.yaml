  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.7/rta-plugin-cnpg_0.2.7_windows_amd64.tar.gz
