  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.14/rta-plugin-cnpg_0.2.14_windows_amd64.tar.gz
  sha256: 3d15f9833c6f8f35117d8068236803ea26256f1ec1d5d60a98f9e10b8e5d4467
