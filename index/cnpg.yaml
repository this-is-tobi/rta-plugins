  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.9/rta-plugin-cnpg_0.2.9_windows_amd64.tar.gz
  sha256: 6ecb895182578fc60fddd8e6c9952a8727080cb190e58b37a608567661a88568
