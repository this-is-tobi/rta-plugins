  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.6/rta-plugin-cnpg_0.2.6_windows_amd64.tar.gz
  sha256: 789c4cf2d3f748e0ce3e0f25634309867b0b4e9764e73da3867f467a7524de96
