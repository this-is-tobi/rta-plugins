  sha256: 8ff00b22d061177b4ebd30306027f56c70511a249193c67c6a72673b26c130b3
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.4/rta-plugin-cnpg_0.2.4_windows_amd64.tar.gz
  sha256: 9edfcf1c625e0d8b11ae95e4978af24042ddecf079e5ef18146769d3c08c3adb
