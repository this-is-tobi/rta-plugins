  sha256: cc6a9026301e27baa8f195182c653f1a17df3d089117f51082e4f0f0d3727095
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.10/rta-plugin-cnpg_0.2.10_windows_amd64.tar.gz
  sha256: c4e387443f2fc1d94a0f646b3b6c74872594167e8e8a68a65c562020c699d524
