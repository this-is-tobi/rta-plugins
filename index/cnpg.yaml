  sha256: 84040675c736322c1f1f5f095ddd37287ef8dda94f48023e09cbe20fc66b4fa5
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.0/rta-plugin-cnpg_0.2.0_linux_arm64.tar.gz
  sha256: 9c60d10791040065d6a78d3554a29d35194784ba162689df9d7a0b584962fbfa
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.0/rta-plugin-cnpg_0.2.0_windows_amd64.tar.gz
  sha256: 5f5bc1604795c368d59fd7999ae98cfb05e27d1a6e87f476cb4ad701b233ddd3
