  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.8/rta-plugin-cnpg_0.2.8_linux_arm64.tar.gz
  sha256: d167912845b577cd36bde6585071ad9fc51926438659983443538df285921629
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.8/rta-plugin-cnpg_0.2.8_windows_amd64.tar.gz
  sha256: 0aeb8511566b86c9edd6371db665a483aa9eb8e2a275b09b6f3ea1d2f1f061d2
