  sha256: 070ffe4302f695506fb28b0064fa3abc6808b34b39ec50951a849d5dadb57de0
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.3/rta-plugin-cnpg_0.2.3_windows_amd64.tar.gz
  sha256: af8079635cf13f705360c1de3079edf4c5deffccfecb2130c5da165f464d3711
