# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.2.11
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.11/rta-plugin-cnpg_0.2.11_darwin_amd64.tar.gz
  sha256: f3ab35ffc3d22bb561b076b7056905432685039caeba6abf1202caea7c4bafba
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.11/rta-plugin-cnpg_0.2.11_darwin_arm64.tar.gz
  sha256: b0872b773e227a5fcc6e9857e178532d99d2272bdc95174d6af44ae1fdd1565d
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
