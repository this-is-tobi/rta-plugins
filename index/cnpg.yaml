  sha256: 019ad3f768d361d19d0e3d96915fceeb4c7a4d342749c0d86d0ab23cf1221d0b
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.13/rta-plugin-cnpg_0.2.13_linux_arm64.tar.gz
  sha256: 46ec07f857664256b38b2c8490899ce3165befc59e9b8990765494b867ebea05
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.13/rta-plugin-cnpg_0.2.13_windows_amd64.tar.gz
  sha256: 6da86aa631bad62ada6126f1cbb1df005e313564abba1e847cde1c716fe146a1
