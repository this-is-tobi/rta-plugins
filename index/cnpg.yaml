  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.1/rta-plugin-cnpg_0.2.1_windows_arm64.tar.gz
  sha256: 93204fdbbbae4e25818c29f1b14405cf7409e1c82473e75f68a2c84397312b58
