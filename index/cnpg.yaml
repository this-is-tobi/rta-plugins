# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.6.3
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.3/rta-plugin-cnpg_0.6.3_darwin_amd64.tar.gz
  sha256: 8e48e1086d9a5c9a037f9ad398b79264b56f2b4280098b9297ac2b981b352fd1
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.3/rta-plugin-cnpg_0.6.3_darwin_arm64.tar.gz
  sha256: 210facd98860b74d2b8f6a99f0a15089eee79c6a496517a1794e06f3fe957a8d
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.3/rta-plugin-cnpg_0.6.3_linux_amd64.tar.gz
  sha256: d780d66a145ad5fbe38b31a14d2da47800f0428ba6704c7fc65dd4329c30e445
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.3/rta-plugin-cnpg_0.6.3_linux_arm64.tar.gz
  sha256: 48865034850bf0d711d93322255fa3a9a16eb60997aebe9b0b904f30ea6195e7
  bin: rta-plugin-cnpg
capabilities:
- id: cnpg.list
  summary: Every CloudNativePG cluster, and whether it is healthy
  safety: read
- id: cnpg.status
  summary: "One cluster in depth: instances, replication, backups, storage"
  safety: read
- id: cnpg.backup.list
  summary: "Backups taken of a cluster: when, how, where they went, and what failed"
  safety: read
- id: cnpg.backup.show
  summary: "How one cluster's backups are set up and where they land: store, retention, schedules"
  safety: read
- id: cnpg.backup.request
  summary: Ask the operator to back a cluster up now, using that cluster's own configuration
  safety: write
  grant: true
- id: cnpg.storage
  summary: "The volumes a cluster's data and WAL sit on: size, class, and whether each one is actually bound"
  safety: read
needs:
- kubeconfig
