  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.5/rta-plugin-cnpg_0.2.5_windows_arm64.tar.gz
  sha256: a5c7768c5339b4ced290c41c53fa3d5936cccbc26671d12be152dd3a1166c672
