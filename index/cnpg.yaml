- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.0/rta-plugin-cnpg_0.2.0_windows_arm64.tar.gz
  sha256: 985bebd2b8090ced5469e7a1f68ace80e97f3e9321df81a5707071a727e05eca
