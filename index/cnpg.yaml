  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.16/rta-plugin-cnpg_0.2.16_windows_amd64.tar.gz
  sha256: a015a756d28c852e5a3483da4412503a5ff81de60daac5d9f7f2175551f55c06
