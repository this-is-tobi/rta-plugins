  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.12/rta-plugin-cnpg_0.2.12_linux_arm64.tar.gz
  sha256: 3a3d4b79fb26c78370ff2809d6274fcd05cd8dfa6c6401a7e2ba3d693c3705da
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.12/rta-plugin-cnpg_0.2.12_windows_amd64.tar.gz
  sha256: a23487b0cdfe5216df50d518d28ca7120815dc0b12a2cae085e2ba39c10d20a6
