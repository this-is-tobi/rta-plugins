# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.15.1
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.15.1/rta-plugin-cnpg_0.15.1_darwin_amd64.tar.gz
  sha256: 46dcc22cddb8f4d6c98bbec0ab57b923ffdc316e17b2e96263a684c938bbf4a8
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.15.1/rta-plugin-cnpg_0.15.1_darwin_arm64.tar.gz
  sha256: 2e51fe72f59ae60a38007a30bbfa0786e17f2f1570ae22a9cc40a799add51d0f
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.15.1/rta-plugin-cnpg_0.15.1_linux_amd64.tar.gz
  sha256: 77ff7d43cd7f3f1cb118e8e0dc5d5ec65d080cae22c0d3571d72f5a76eeb3c25
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.15.1/rta-plugin-cnpg_0.15.1_linux_arm64.tar.gz
  sha256: 820e9d2a6ed6fa81afaf469fb2c72332d94230b528aa418308c3bc88c23cb5ae
  bin: rta-plugin-cnpg
capabilities:
- id: cnpg.list
  summary: Every CloudNativePG cluster, and whether it is healthy
  safety: read
- id: cnpg.status
  summary: "One cluster in depth: instances, replication, backups, storage"
  safety: read
- id: cnpg.backup.list
  summary: "Backups taken of a cluster: when, how, where they went, and what failed"
  safety: read
- id: cnpg.backup.show
  summary: "How one cluster's backups are set up and where they land: store, retention, schedules"
  safety: read
- id: cnpg.backup.request
  summary: Ask the operator to back a cluster up now, using that cluster's own configuration
  safety: write
  grant: true
- id: cnpg.storage
  summary: "The volumes a cluster's data and WAL sit on: size, class, and whether each one is actually bound"
  safety: read
needs:
- kubeconfig
