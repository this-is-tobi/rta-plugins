# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.3.0
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.3.0/rta-plugin-cnpg_0.3.0_darwin_amd64.tar.gz
  sha256: c72ef7d57e4d43c116eab3676ae519775c10af038055bc0921a4890f94a2fc18
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.3.0/rta-plugin-cnpg_0.3.0_darwin_arm64.tar.gz
  sha256: a48674fe33f21898ba14df89d5937f1a6339c00c10227493422d4be3c900acdf
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
