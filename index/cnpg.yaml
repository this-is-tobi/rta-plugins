  sha256: b3e5779859c11dda7df50c6e280b6465b068baea15e9a11935f5182652eaf625
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.1/rta-plugin-cnpg_0.2.1_linux_arm64.tar.gz
  sha256: 199a37839ea0830d09865e2a5a95e613cdb10995af28108f63d9d2a1bef1e8d7
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.1/rta-plugin-cnpg_0.2.1_windows_amd64.tar.gz
  sha256: 823726cde88e0b4a7d969a68447b00366cfcaf45cc260e7b23887dfefc5c5616
