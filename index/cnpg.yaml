# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.12.2
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.12.2/rta-plugin-cnpg_0.12.2_darwin_amd64.tar.gz
  sha256: 2cdfa850a37bbf892556d967b39935c68137a0fc6da7655f3393449cd0b20dd9
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.12.2/rta-plugin-cnpg_0.12.2_darwin_arm64.tar.gz
  sha256: 6625a8b6eee223b8297a6fed1a8153d27685cab63e9ce4c101cbab87b3e7df7a
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.12.2/rta-plugin-cnpg_0.12.2_linux_amd64.tar.gz
  sha256: 7b10f87b95b94e3f665aa995106726222786f0e0e04e7911d5709ed1a8271a1a
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.12.2/rta-plugin-cnpg_0.12.2_linux_arm64.tar.gz
  sha256: 0c418e4305c5f03a2f5b24078c4c064d03a9f0610b9347441d80121a19c54823
  bin: rta-plugin-cnpg
capabilities:
- id: cnpg.list
  summary: Every CloudNativePG cluster, and whether it is healthy
  safety: read
- id: cnpg.status
  summary: "One cluster in depth: instances, replication, backups, storage"
  safety: read
- id: cnpg.backup.list
  summary: "Backups taken of a cluster: when, how, where they went, and what failed"
  safety: read
- id: cnpg.backup.show
  summary: "How one cluster's backups are set up and where they land: store, retention, schedules"
  safety: read
- id: cnpg.backup.request
  summary: Ask the operator to back a cluster up now, using that cluster's own configuration
  safety: write
  grant: true
- id: cnpg.storage
  summary: "The volumes a cluster's data and WAL sit on: size, class, and whether each one is actually bound"
  safety: read
needs:
- kubeconfig
