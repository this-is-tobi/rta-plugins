  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.22/rta-plugin-cnpg_0.2.22_windows_arm64.tar.gz
  sha256: ccca4f22f19753383d638ab28f7d92bd67d80fadb009e34daf828fa3978d4a3f
