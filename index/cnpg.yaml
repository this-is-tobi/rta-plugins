  sha256: 446800bd69c093cf87a28cc6c62122f34aa93f0d4bc0084f648e2ff0b5429d84
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.2/rta-plugin-cnpg_0.2.2_windows_amd64.tar.gz
  sha256: 54c8e5d46a86f9c5fc9cc8ebaa84ea9b3cd54314a94c378a2e7611cf689a4f28
