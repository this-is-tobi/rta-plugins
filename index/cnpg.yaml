  sha256: 31bf58aa6b1ef76506571b1c1724b6cc641f6e3244360553b51f64eda5c7b242
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.19/rta-plugin-cnpg_0.2.19_linux_arm64.tar.gz
  sha256: f053dc4bdd80e35ffceb405306eae203a1d21a303c47a6767e6497c0c17e76e2
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.19/rta-plugin-cnpg_0.2.19_windows_amd64.tar.gz
  sha256: 56476d7a0c6f5255f5f596b0dd556da4b63dcafc380529857d5669f7371c0e2b
