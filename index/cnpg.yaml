# rta-plugin-cnpg, as rta read it out of the binary.
#
# Everything here except the platform URLs came from the artifact's own
# declaration, so this file cannot disagree with the plugin it describes.
# `rta plugin install` derives all of it again from the bytes it downloads
# and refuses the install if the two differ, naming this index.
#
# Regenerate with `rta plugin manifest` rather than editing.
name: cnpg
version: 0.6.5
summary: Read the state of CloudNativePG PostgreSQL clusters
homepage: https://github.com/this-is-tobi/rta-plugins/tree/main/plugins/cnpg
platforms:
- os: darwin
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.5/rta-plugin-cnpg_0.6.5_darwin_amd64.tar.gz
  sha256: e741b565a4a44f7b9f6ec962599642719d0f7e1a5c24465246b5c469c5e232c3
  bin: rta-plugin-cnpg
- os: darwin
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.5/rta-plugin-cnpg_0.6.5_darwin_arm64.tar.gz
  sha256: fb117c086c8710f23de10b91308f05610add0985200706402debefd5d6b11adf
  bin: rta-plugin-cnpg
- os: linux
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.5/rta-plugin-cnpg_0.6.5_linux_amd64.tar.gz
  sha256: 73094ed0da2713e143649c8f57d8c51b1fb2dafed45d4846a24c51ca1f973d97
  bin: rta-plugin-cnpg
- os: linux
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.6.5/rta-plugin-cnpg_0.6.5_linux_arm64.tar.gz
  sha256: 635b26cc84b029b08e8609e6f65cbe2656927a9222bad2d301700603a5984b81
  bin: rta-plugin-cnpg
capabilities:
- id: cnpg.list
  summary: Every CloudNativePG cluster, and whether it is healthy
  safety: read
- id: cnpg.status
  summary: "One cluster in depth: instances, replication, backups, storage"
  safety: read
- id: cnpg.backup.list
  summary: "Backups taken of a cluster: when, how, where they went, and what failed"
  safety: read
- id: cnpg.backup.show
  summary: "How one cluster's backups are set up and where they land: store, retention, schedules"
  safety: read
- id: cnpg.backup.request
  summary: Ask the operator to back a cluster up now, using that cluster's own configuration
  safety: write
  grant: true
- id: cnpg.storage
  summary: "The volumes a cluster's data and WAL sit on: size, class, and whether each one is actually bound"
  safety: read
needs:
- kubeconfig
