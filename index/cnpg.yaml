- os: windows
  arch: arm64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.8/rta-plugin-cnpg_0.2.8_windows_arm64.tar.gz
  sha256: 2e966d466f37661e059be42abea0cf2f3285520d628b5f47935a452a379daab5
