  sha256: 2f9fced6a12d30eda776a19445936e57c3b5f127f2ae2bb6663c488672cd2870
  bin: rta-plugin-cnpg
- os: windows
  arch: amd64
  url: https://github.com/this-is-tobi/rta-plugins/releases/download/plugins%2Fcnpg%2Fv0.2.22/rta-plugin-cnpg_0.2.22_windows_amd64.tar.gz
  sha256: 92b9b0f861ed0c13c3171512fa95713f626ba1d73b1dfc5ff58444090a537a2c
